      } else {

}

/** The two tower cranes: their masts and slewing tops, the hook and its load, and the jobs that put blocks back. */

  const {
    ringAt, hull, poly, open, seg, clamp, lerp, mk, solid, place, sA, cA, depth, wrap, smooth, SZ, SL, SAFE,
    HOOK_GROUND, JIB, CRANES, P, ground, layer, tops, item, setD, putC, rring, rbox, story, still,

  // ---------------------------------------------------------------- cranes
  function makeCrane(c) {

    const { x, y, H } = c;
    // footing, mast and its lattice
    const g = mk("g", {}, layer);
    putC(solid(g), rbox(x, y, 0, -13, -13, 13, 13, 0, 4.5, 3, 1.2));
    putC(solid(g), rbox(x, y, 0, -4.6, -4.6, 4.6, 4.6, 4.5, H, 1.2, 0.6));
    let lat = "";
    const zs = [];
    for (let z = 6; z <= H - 2; z += 7.5) zs.push(z);
    lat += open(zs.map((z, i) => P(x + 4.6, y + (i % 2 ? 3.2 : -3.2), z)));
    lat += open(zs.map((z, i) => P(x + (i % 2 ? -3.2 : 3.2), y + 4.6, z)));
    mk("path", { class: "nf", d: lat }, g);
    item(g, depth(x, y));
    // the hook, its cable and slings: an item, so it paints in depth order with the load
    const hg = mk("g", {}, layer);
    k.cable = mk("path", { class: "nf" }, hg);
    k.block = solid(hg);
    k.hook = mk("path", { class: "nf sil" }, hg);
    k.sling = mk("path", { class: "nf" }, hg);

      turn: solid(t), cab: solid(t), win: mk("path", { class: "nf" }, t),
      trolley: solid(t), jib: solid(t), jl: mk("path", { class: "nf" }, t), ties: mk("path", { class: "nf" }, t),
    };

    const L = (u, v, z) => P(x + u * c - v * s, y + u * s + v * c, z);
    const away = c * sA + s * cA < 0;
    if (away !== k.side) {
      k.side = away;
      const back = [p.cw.g, p.cj.g, p.cjl, p.apex, p.turn.g, p.cab.g, p.win], jib = [p.trolley.g, p.jib.g, p.jl];

    putC(p.turn, rbox(x, y, th, -7, -7, 7, 7, H, H + 2.5, 2, 0.8));
    putC(p.cab, rbox(x, y, th, -1, 4, 8, 11, H + 2.5, H + 10.5, 1.4, 0.7));

    putC(p.trolley, rbox(x, y, th, r - 4, -3.6, r + 4, 3.6, H - 1.4, H + 2.6, 1, 0.5));
    putC(p.jib, rbox(x, y, th, -4, -3, JIB, 3, H + 2.5, H + 9, 1, 0.6));

      { h: SAFE }, { th: st, r: sr }, { h: s.z0 + SZ + 2 + SL, low: true },

  return {
    cranes, polar, hookAt,
    update(dt) { for (const k of cranes) { craneStep(k, dt); swing(k, dt); } },
    draw() { for (const k of cranes) drawCrane(k); },
  };
}

/**
 * The crew: a manager, a signalman for each crane, an onlooker, a shoveler, a
 * barrow and its pusher, and a labourer with cement bags.
 *
 * Each worker is a jointed body about seven heads tall, built fresh every frame

 * far the back leans and twists, where the hands are wanted and where the head
 * looks. Legs and arms reach their feet and hands by two-bone IK and are drawn
 * as tapered capsules, so knees and elbows bend. The feet are planted on the
 * ground and stepped by a gait clock that runs on distance walked, so they never
 * slide. Far limbs go behind the torso and near ones in front of it.

  const {
    hull, run, clamp, lerp, rad, mk, sA, cA, VIEW, LIGHT, RIGHT, wrap, smooth, lerpA, rrect, rring,
    PILE, MIXER, PALLET, LOAD, DUMP, BOSS, P, S, layer, item, setD, frame, story, hash, toneOf,
    boxFaces, shadedBox, putBox, makeShadow, depth,

   * outline, mitred at the joints, with round ends.

    for (let i = 0; i < n - 1; i++) {
      const dx = q[i + 1][0] - q[i][0], dy = q[i + 1][1] - q[i][1], l = Math.hypot(dx, dy);
      if (l > 0.05) {
        px = -dy / l; py = dx / l;

      else if (j === n - 1) { mx = nx[n - 2]; my = ny[n - 2]; }

    for (let j = 1; j < n; j++) s += "L" + pt(L[j]);

    for (let j = n - 2; j >= 0; j--) s += "L" + pt(R[j]);

  // chin about 20, the crown of the head 22.8 and the hard hat 23.2.
  const THIGH = 5.5, SHIN = 5.4, UPPER = 4.4, FORE = 3.4, ANK = 1.05, HIPW = 1.15, SHW = 2.35, STAND = 11.75;
  const LEGMAX = (THIGH + SHIN) * 0.994;

  const TORSO = [[0.35, 1.45, 2.25], [2.2, 1.42, 2.1], [4.9, 1.7, 2.6], [6.15, 1.45, 2.9], [6.95, 1.0, 1.55]];
  const ANG8 = Array.from({ length: 8 }, (_, i) => [Math.cos((i / 8) * TPI), Math.sin((i / 8) * TPI)]);
  const ANG16 = Array.from({ length: 16 }, (_, i) => [Math.cos((i / 16) * TPI), Math.sin((i / 16) * TPI)]);
  const ANG6 = Array.from({ length: 6 }, (_, i) => [Math.cos((i / 6) * TPI + 0.5), Math.sin((i / 6) * TPI + 0.5)]);
  const ANG12 = Array.from({ length: 12 }, (_, i) => [Math.cos((i / 12) * TPI), Math.sin((i / 12) * TPI)]);
  /** A work boot in the foot's frame: u forward from the ankle, v left, z up from the sole. */
  const BOOT = [];
  for (const s of [-1, 1]) BOOT.push([-0.95, s * 0.5, 0], [1.7, s * 0.6, 0], [2.55, s * 0.3, 0.1], [2.4, s * 0.38, 0.7], [1.3, s * 0.52, 1.05], [0.4, s * 0.55, 1.8], [-0.8, s * 0.52, 1.8], [-1.05, s * 0.5, 0.75]);
  /** The swing's share of a stride. */
  const SIG = 0.42;
  const NONE = {};

  function makePerson(x, y, f, o = {}) {
    const g = mk("g", {}, layer), legs = mk("g", {}, g);
    const p = {
      x, y, f, px: x, py: y, pf: f, vx: 0, vy: 0, walk: 0, ph: 0, cv: 0, speed: o.speed || 20, boss: !!o.boss,
      lean: 0, crouch: 0, twist: 0, tilt: 0, sway: 0, hy: 0, hp: 0, nod: 0, look: null, want: NONE,
      seed: o.seed || 0, t: (o.seed || 0) * 3.1, hands: null, extra: null, props: [], it: item(g), order: "",
    };
    p.shadow = makeShadow();
    p.legsG = legs;
    p.leg = [0, 1].map(() => mk("path", { class: "sil t2" }, legs));
    p.boot = [0, 1].map(() => mk("path", { class: "sil t1" }, legs));
    p.back = mk("g", {}, g);
    p.arm = [0, 1].map(() => mk("path", { class: "sil t3" }, p.back));
    p.torso = mk("path", { class: "sil " + (o.boss ? "t4" : "hv") }, g);
    p.marks = mk("path", { class: o.boss ? "fo t2" : "lo t4" }, g);
    p.head = mk("path", { class: "sil t5" }, g);
    p.hat = mk("path", { class: (o.boss ? "hi" : "sil") + " hv" }, g);
    p.front = mk("g", {}, g);
    const Wd = frame(x, y, f);
    p.feet = [1, -1].map((s) => { const q = Wd(0, s * HIPW, 0); return { s, x: q[0], y: q[1], f, z: 0, sw: false, fx: 0, fy: 0, ff: 0, pitch: 0 }; });

  }

  /**
   * The gait. A clock runs on distance walked (and on turning, and on its own
   * while a step is unfinished); the left foot swings in the first SIG of each
   * cycle and the right half a cycle later. A swinging foot flies to where its
   * hip will be when it lands, plus half a stance ahead, so a planted foot stays put.
   */
  function gait(p, dt) {
    const dx = p.x - p.px, dy = p.y - p.py, dist = Math.hypot(dx, dy), turn = Math.abs(wrap(p.f - p.pf));
    p.px = p.x; p.py = p.y; p.pf = p.f;
    const k = Math.min(1, dt * 10);
    p.vx += (dx / dt - p.vx) * k; p.vy += (dy / dt - p.vy) * k;
    const v = Math.hypot(p.vx, p.vy), wv = clamp(v / 6, 0, 1);
    p.walk += (wv - p.walk) * Math.min(1, dt * 6);
    const Lc = 7 + 0.5 * Math.max(8, v);
    const Wd = frame(p.x, p.y, p.f);
    let err = 0;
    for (const ft of p.feet) {
      const h = Wd(0, ft.s * HIPW, 0);
      err = Math.max(err, Math.hypot(ft.x - h[0], ft.y - h[1]) + Math.abs(wrap(ft.f - p.f)) * 1.6);
    }
    let dg = dist / Lc + turn * 0.32;
    if ((p.feet[0].sw || p.feet[1].sw || err > 1.2) && dg < dt * 1.9) dg = dt * 1.9;
    p.ph = (p.ph + dg) % 1;
    const ux = v > 0.3 ? p.vx / v : 0, uy = v > 0.3 ? p.vy / v : 0;
    for (const ft of p.feet) {
      const loc = (p.ph - (ft.s > 0 ? 0 : 0.5) + 1) % 1, swinging = loc < SIG;
      if (swinging && !ft.sw) { ft.sw = true; ft.fx = ft.x; ft.fy = ft.y; ft.ff = ft.f; }
      if (!ft.sw) {
        // planted: the heel peels up as the body passes over the foot
        const rel = (ft.x - p.x) * Math.cos(p.f) + (ft.y - p.y) * Math.sin(p.f);
        ft.pitch += (clamp((-rel - 1.2) / 3.4, 0, 1) * 0.6 * wv - ft.pitch) * Math.min(1, dt * 14);
        continue;
      }
      const t = swinging ? loc / SIG : 1;
      const h = Wd(0, ft.s * HIPW, 0), reach = ((SIG - t * SIG) * Lc + (1 - SIG) * Lc * 0.5) * wv;
      const e = smooth(t);
      ft.x = lerp(ft.fx, h[0] + ux * reach, e); ft.y = lerp(ft.fy, h[1] + uy * reach, e);
      ft.f = lerpA(ft.ff, p.f + ft.s * 0.08, e);

      // toe-off, then the toe lifts for the heel strike
      ft.pitch = (1 - ease(t, 0, 0.35)) * 0.6 * wv - ease(t, 0.55, 1) * 0.3 * wv;

  }

  /** The idle life every body shares: breath, weight shifts, where the head looks, the pose's easing. */
  function life(p, dt) {
    p.t += dt;
    gait(p, dt);
    const w = p.want || NONE, k = Math.min(1, dt * (w.rate || 7));
    p.lean += ((w.lean || 0) + 0.07 * p.walk - p.lean) * k;
    p.crouch += ((w.crouch || 0) + 0.3 * p.walk - p.crouch) * k;
    p.twist += ((w.twist || 0) - p.twist) * k;
    p.tilt += ((w.tilt || 0) - p.tilt) * k;

    const swayW = -0.28 * p.walk * Math.sin(TPI * p.ph + 0.4);
    p.sway += (shift * idle + swayW - p.sway) * Math.min(1, dt * 4);

  const hookAt = (k) => [k.x + k.r * Math.cos(k.th) + k.sx, k.y + k.r * Math.sin(k.th) + k.sy, k.h - 2];
  /** The nearest thing on the move worth a glance: a working hook, or the barrow. */
  function movingThing(p) {
    let best = null, bd = 1e9;
    for (const k of cranes) {
      if (!k.cur || k.cur.idle) continue;
      const h = hookAt(k), d = Math.hypot(h[0] - p.x, h[1] - p.y);
      if (d < bd) { bd = d; best = h; }
    }
    if (pusher && pusher !== p && pusher.walk > 0.3) {

      if (d < bd) best = [barrow.x, barrow.y, 6];

    return best;

  /** Tone index of a side of the body whose outward normal is n, seen partly face on. */
  const sideTone = (nx, ny) => toneN([nx * 0.5 + VIEW[0] * 0.5, ny * 0.5 + VIEW[1] * 0.5, 0.12 + VIEW[2] * 0.5]);

  function drawPerson(p) {
    const f = p.f, cf = Math.cos(f), sf = Math.sin(f);
    const fw = [cf, sf, 0], lf = [-sf, cf, 0];

    // ---- feet: the ankle and the boot, rolled about the ball (heel up) or the ankle (toe up)
    const ank = [];
    for (let i = 0; i < 2; i++) {
      const ft = p.feet[i], c1 = Math.cos(ft.f), s1 = Math.sin(ft.f), pc = Math.cos(ft.pitch), ps = Math.sin(ft.pitch);
      const pu = ft.pitch > 0 ? 2.3 : 0, pz = ft.pitch > 0 ? 0 : ANK;

        const du = a - pu, dz = c - pz, a2 = pu + du * pc + dz * ps, z2 = pz + dz * pc - du * ps;

      };
      ank.push(loc(0, 0, ANK));

      if (ft.bk !== bk) { ft.bk = bk; ft.bootD = shape(hull(BOOT.map((q) => P3(loc(q[0], q[1], q[2]))))); }
    }

    // ---- the hips: as high as both legs can reach, lowered by the crouch, shifted by the sway

    }
    pel[2] = Math.max(hz, STAND - 5);

    // ---- the torso's frame: a forward lean, a twist that grows up the spine, a sideways tilt
    const rel = p.feet.map((ft) => (ft.x - pel[0]) * cf + (ft.y - pel[1]) * sf);
    const tw = p.twist + 0.012 * p.walk * (rel[0] - rel[1]);

    for (let i = 0; i < 2; i++) {
      const s = p.feet[i].s, hip = T(0, s * HIPW, 0);

      setD(p.leg[i], limbPath([P3(hip), P3(kn), P3(an)], [1.3 * S, 0.88 * S, 0.6 * S]));
      setCls(p.leg[i], "sil t" + Math.max(1, tones[i] - 1));

    }

    // ---- torso
    const sil = [];
    for (const [h, hd, hw] of TORSO) {

    const hyaw = f + tw + p.hy, hpit = Math.max(-0.55, p.hp - 0.35 * p.lean);

    const hf = [cpt * cy, cpt * sy, spt], hl = [-sy, cy, 0], hu = [-spt * cy, -spt * sy, cpt];
    const piv = T(0.3, 0, 8.0 + br);
    const HD = (a, b, c) => [piv[0] + hf[0] * a + hl[0] * b + hu[0] * c, piv[1] + hf[1] * a + hl[1] * b + hu[1] * c, piv[2] + hf[2] * a + hl[2] * b + hu[2] * c];
    const hp = [P3(T(0.2, 0.62, 6.9)), P3(T(0.2, -0.62, 6.9)), P3(T(-0.35, 0, 6.95)), P3(HD(0.95, 0, -0.05))];
    for (const [c, sc] of [[-0.85, 0.72], [0.2, 1], [1.2, 0.68]]) for (const [u, v] of ANG8) hp.push(P3(HD(0.15 + 1.22 * u * sc, 1.0 * v * sc, 1.45 + c)));
    setD(p.head, shape(hull(hp)));
    // the hard hat: shell and brim in one outline, with the seam where they meet and the ridge over the crown
    const C0 = 1.85, hat = [], base = [];
    for (const [u, v] of ANG12) {
      hat.push(P3(HD(0.12 + u * (u > 0 ? 2.5 : 1.92), v * 1.8, C0 - 0.04)));
      const nx = hf[0] * u + hl[0] * v, ny = hf[1] * u + hl[1] * v;
      base.push({ u, v, vis: nx * sA + ny * cA > 0 });
    }
    for (const [c, sc] of [[0.9, 0.9], [1.45, 0.62]]) for (const [u, v] of ANG8) hat.push(P3(HD(0.12 + u * (u > 0 ? 1.75 : 1.65) * sc, v * 1.58 * sc, C0 + c)));
    hat.push(P3(HD(0.05, 0, C0 + 1.75)));
    const seam = run(base, (q) => q.vis).map((q) => P3(HD(0.12 + q.u * (q.u > 0 ? 1.75 : 1.65), q.v * 1.58, C0)));
    let ridge = [];
    for (let i = 0; i <= 6; i++) {
      const a = 0.35 + (i / 6) * 2.3, ca = Math.cos(a), sa = Math.sin(a);

    }
    setD(p.hat, shape(hull(hat)) + (seam.length > 1 ? shape(seam, false) : "") + (ridge.length > 1 ? shape(ridge, false) : ""));

    // ---- arms: hanging and swinging against the legs, unless the pose wants the hands somewhere
    const chestD = dW(T(0.2, 0, 4.5));
    const armD = [0, 0];
    for (let i = 0; i < 2; i++) {
      const s = i === 0 ? 1 : -1, sh = T(0, s * SHW, 6.1 + br);
      const sw = clamp(-0.42 * rel[i], -2.6, 2.6) * p.walk + 0.45;
      let hand = [sh[0] + cf * sw - sf * s * 0.5, sh[1] + sf * sw + cf * s * 0.5, sh[2] - 7.2 + 0.12 * Math.abs(sw)];
      let pole = [-cf + lf[0] * s * 0.35, -sf + lf[1] * s * 0.35, -0.1], tipLen = 1.15, tipR = 0.55, tipDir = null;
      const own = p.hands && p.hands(s, J, sh);
      if (own) {
        const w = own.w == null ? 1 : own.w;
        hand = mix3(hand, own.at, w);
        if (own.pole) pole = w >= 1 ? own.pole : add3(pole, own.pole, w * 2);
        if (own.tipLen) { tipLen = own.tipLen; tipR = own.tipR || tipR; }
        tipDir = own.tipDir || null;
      }
      const [el, wr] = ik(sh, hand, UPPER, FORE, pole);
      const dir = tipDir || unit([wr[0] - el[0], wr[1] - el[1], wr[2] - el[2]]);
      const tip = add3(wr, dir, tipLen);
      setD(p.arm[i], limbPath([P3(sh), P3(el), P3(wr), P3(tip)], [0.85 * S, 0.62 * S, 0.45 * S, tipR * S]));
      setCls(p.arm[i], "sil t" + (p.boss ? Math.max(1, tones[i] - 1) : tones[i]));
      armD[i] = dW(sh) - chestD + 0.5 * (dW(wr) - chestD);
      J["hand" + i] = wr;
    }

    // ---- props and the order of everything that can pass in front of the torso or behind it
    if (p.extra) p.extra(p, J);
    const key = (legD[0] > legD[1] ? "a" : "b") + (armD[0] > 0.35 ? "F" : "B") + (armD[1] > 0.35 ? "F" : "B") + (armD[0] > armD[1] ? "1" : "0") + p.props.map((q) => (q.front ? "F" : "B")).join("");
    if (key !== p.order) {
      p.order = key;
      const L = legD[0] > legD[1] ? [1, 0] : [0, 1];
      for (const i of L) { p.legsG.appendChild(p.leg[i]); p.legsG.appendChild(p.boot[i]); }
      for (const q of p.props) (q.front ? p.front : p.back).appendChild(q.el);
      for (const i of armD[0] > armD[1] ? [1, 0] : [0, 1]) (armD[i] > 0.35 ? p.front : p.back).appendChild(p.arm[i]);
    }

    // ---- the soft contact shadow, between the feet
    const mx = (p.feet[0].x + p.feet[1].x) / 2, my = (p.feet[0].y + p.feet[1].y) / 2;
    const shx = mx * 0.6 + pel[0] * 0.4, shy = my * 0.6 + pel[1] * 0.4, srx = 3.3 + Math.abs(rel[0] - rel[1]) * 0.3;
    const sk = F(shx) + " " + F(shy) + " " + F(srx) + " " + F(f * 10);
    if (p.sk !== sk) { p.sk = sk; p.shadow.set(shx, shy, srx, 2.4, f, 0.4); }
    p.it.key = depth(p.x, p.y);
  }

  /** The vest's two reflective bands, and its front opening when the front is in view. */
  function vestMarks(p, T, tw) {
    let d = "";
    const at = (h) => { for (let i = 1; i < TORSO.length; i++) if (h <= TORSO[i][0]) { const a = TORSO[i - 1], b = TORSO[i], t = (h - a[0]) / (b[0] - a[0]); return [lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; } return TORSO[TORSO.length - 1].slice(1); };
    for (const [h0, h1] of [[1.35, 1.95], [3.55, 4.15]]) {
      const ring = [];
      const [hd, hw] = at((h0 + h1) / 2), yaw = p.f + tw * clamp(h0 / 6.3, 0, 1);
      for (const [c, s] of ANG12) {
        const nu = c / hd, nv = s / hw, nx = nu * Math.cos(yaw) - nv * Math.sin(yaw), ny = nu * Math.sin(yaw) + nv * Math.cos(yaw);
        ring.push({ c, s, vis: nx * sA + ny * cA > 0.02 });
      }
      const vis = run(ring, (q) => q.vis);
      if (vis.length < 2) continue;
      const lo = vis.map((q) => P3(T(q.c * (hd + 0.04), q.s * (hw + 0.04), h0))), up = vis.map((q) => P3(T(q.c * (hd + 0.04), q.s * (hw + 0.04), h1)));
      d += shape(lo.concat(up.reverse()));
    }
    const fyaw = p.f + tw * 0.6;
    if (Math.cos(fyaw) * sA + Math.sin(fyaw) * cA > 0.15) d += shape([P3(T(1.47, 0, 0.45)), P3(T(1.7, 0, 4.9)), P3(T(1.15, 0, 6.6))], false);
    return d;
  }

  /** The manager's jacket: the side turned from the light, as a band up the torso. */
  function jacketShade(p, T, tw) {
    const a = [], b = [];
    for (const [h, hd, hw] of TORSO.slice(0, 4)) {
      const yaw = p.f + tw * clamp(h / 6.3, 0, 1), cy = Math.cos(yaw), sy = Math.sin(yaw);
      const ring = ANG16.map(([c, s]) => {
        const nu = c / hd, nv = s / hw, nx = nu * cy - nv * sy, ny = nu * sy + nv * cy;
        return { c, s, vis: nx * sA + ny * cA > 0, dark: nx * LIGHT[0] + ny * LIGHT[1] < 0 };
      });
      const shade = run(ring, (q) => q.vis).filter((q) => q.dark);
      if (shade.length < 2) continue;
      a.push(P3(T(shade[0].c * hd, shade[0].s * hw, h)));
      b.push(P3(T(shade[shade.length - 1].c * hd, shade[shade.length - 1].s * hw, h)));
    }
    return a.length > 1 ? shape(a.concat(b.reverse())) : "";
  }

  /** Moves a body one step toward (tx, ty): it turns first, then walks, speeding up and slowing down. True once it is there. */
  function walkTo(p, tx, ty, dt, speed = p.speed) {
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d < 0.5) { p.cv = 0; return true; }
    const want = Math.atan2(dy, dx), off = Math.abs(wrap(want - p.f));
    turnTo(p, want, dt, 5, off >= 1 && d > 2 * (p.pivot || 0));
    const vmax = off < 1 ? Math.min(speed * (1 - off * 0.5), Math.sqrt(2 * 40 * d) + 1.5) : 0;
    p.cv += clamp(vmax - p.cv, -70 * dt, 32 * dt);
    const step = Math.min(d, Math.max(0, p.cv) * dt);
    p.x += (dx / d) * step; p.y += (dy / d) * step;
    return false;
  }
  /** Turns a body toward want. One pushing a barrow turns about a point ahead of him, walking round it, as the barrow pivots on its middle. */
  function turnTo(p, want, dt, rate = 4, pivot = false) {
    if (!p.pivot || !pivot) { p.f += clamp(wrap(want - p.f), -rate * dt, rate * dt); return; }

  const people = [boss, ...signals, watcher, pusher, shovel, carrier];

  let tick = 0, simDt = 0, frameDt = 1 / 60;

    if (loading || shovel.cyc > 0) {
      const before = shovel.cyc;
      shovel.cyc += dt / 2.3;
      if (before < 0.68 && shovel.cyc >= 0.68) barrow.fill = Math.min(1, barrow.fill + 0.25);
      if (before === 0) shovel.from = shovel.pose;
      if (shovel.cyc >= 1) { shovel.cyc = loading ? shovel.cyc - 1 : 0; shovel.from = SHOVEL.aim; }
      const c = shovel.cyc, A = SHOVEL.dig, Bp = SHOVEL.lift, Tp = SHOVEL.toss, sw = wrap(fBar - fPile);
      let turn = 0;
      // aim at the pile, thrust the blade in, pry and lift, swing round, toss, swing back
      if (c < 0.12) { shovel.pose = mixPose(shovel.from, SHOVEL.aim, ease(c, 0, 0.12)); turn = 0; }
      else if (c < 0.22) { shovel.pose = mixPose(SHOVEL.aim, A, ease(c, 0.12, 0.22)); turn = 0; }
      else if (c < 0.38) { shovel.pose = mixPose(A, Bp, ease(c, 0.22, 0.38)); turn = 0; }
      else if (c < 0.6) { shovel.pose = Bp; turn = ease(c, 0.38, 0.6); }
      else if (c < 0.72) { shovel.pose = mixPose(Bp, Tp, ease(c, 0.6, 0.72)); turn = 1; }
      else { shovel.pose = mixPose(Tp, SHOVEL.aim, ease(c, 0.72, 1)); turn = 1 - ease(c, 0.72, 1); }
      // the hips swing most of the way round and the shoulders twist the rest
      const fTo = fPile + sw * 0.68 * turn;
      shovel.f = lerpA(shovel.f, fTo, Math.min(1, dt * 12));
      shovel.want = { lean: shovel.pose.lean, crouch: shovel.pose.crouch, twist: sw * 0.32 * turn, rate: 14, shift: 0 };
      shovel.grip += (1 - shovel.grip) * Math.min(1, dt * 6);
      shovel.look = shovelPts({ fw: [Math.cos(shovel.f), Math.sin(shovel.f)], lf: [-Math.sin(shovel.f), Math.cos(shovel.f)] }).X;
      shovel.curious = false;
    } else {
      turnTo(shovel, rad(-60), dt, 1.5);
      shovel.pose = mixPose(shovel.pose, SHOVEL.rest, Math.min(1, dt * 4));
      if (Math.abs(shovel.pose.G[2] - SHOVEL.rest.G[2]) < 0.02) shovel.pose = SHOVEL.rest;
      shovel.want = { lean: shovel.pose.lean, crouch: shovel.pose.crouch, shift: 0.25 };
      shovel.grip += (0 - shovel.grip) * Math.min(1, dt * 5);
      shovel.look = null; shovel.curious = true;
    }

    // ---- the labourer
    runRoute(carrier, dt);
    {
      const cs = carrier.route[carrier.ri], w = carrier.wt || 0;
      if (cs.act === "pick") {
        if (w >= 0.6) carrier.bag = true;
        const bend = ease(w, 0, 0.5) * (1 - ease(w, 0.75, 1.3));
        carrier.want = { lean: 0.55 * bend, crouch: 2.0 * bend, rate: 9, shift: 0 };
      } else if (cs.act === "drop") {
        if (w >= 1.0) carrier.bag = false;
        const bend = ease(w, 0.45, 0.95) * (1 - ease(w, 1.05, 1.5));
        carrier.want = { lean: 0.3 * bend, crouch: 0.5 * bend, rate: 9, shift: 0 };
      } else carrier.want = carrier.bag ? { lean: 0.1, crouch: 0.35, tilt: 0.07, shift: 0.1 } : NONE;
      carrier.curious = !carrier.bag;
      carrier.look = cs.act === "pick" && w < 1.1 ? [carrier.x + Math.cos(carrier.f) * 7, carrier.y + Math.sin(carrier.f) * 7, 11] : cs.act === "drop" ? [MOUTH[0], MOUTH[1], 16] : null;
    }

    // ---- signalmen follow their crane's job
    for (const p of signals) {
      const k = p.k, b = k.job;
      let to = k.home, look = hookAt(k);
      if (k.mode === "setdown") { to = [k.spot[0] + 3, k.spot[1] + 17]; }
      else if (b && b.state === "ground") { to = [b.x + 3, b.y + 17]; }
      else if (b) { to = [b.slot.cx + 3, 30]; }
      const there = walkTo(p, to[0], to[1], dt);
      if (there) turnTo(p, toward(p, look), dt, 3);
      const busy = there && b && k.cur;
      p.raise += ((busy && k.cur.low ? 1 : 0) - p.raise) * Math.min(1, dt * 5);
      p.beck += ((busy && k.cur.th != null ? 1 : 0) - p.beck) * Math.min(1, dt * 5);
      p.cheer += ((story.phase === "fixed" ? 1 : 0) - p.cheer) * Math.min(1, dt * 5);
      p.look = b || k.mode ? look : null;
      p.want = { shift: there ? 0.3 : 0 };
    }

    // ---- the manager turns to whatever is being set down and points at it; nods when it lands; reads his clipboard between
    const busy = cranes.find((k) => k.cur && k.cur.low && k.job);
    if (busy) boss.target = hookAt(busy);
    boss.pw += ((busy || story.phase === "fixed" ? 1 : 0) - boss.pw) * Math.min(1, dt * 3);
    if (story.phase === "fixed") boss.target = [boss.x + Math.cos(boss.f) * 2, boss.y + Math.sin(boss.f) * 2, 60];
    const look = busy ? toward(boss, boss.target) : boss.home;
    turnTo(boss, boss.home + clamp(wrap(look - boss.home), -1, 1), dt, 1.2);
    if (story.placed > boss.placed) boss.nodT = 0;
    boss.placed = story.placed;
    boss.nodT += dt;
    { const sn = Math.sin(Math.min(1, boss.nodT / 0.9) * Math.PI * 2); boss.nod = boss.nodT < 1 ? -0.3 * sn * sn : 0; }
    const reading = !busy && story.phase !== "fixed" && (boss.t % 9) > 5.2;
    boss.glance += ((reading ? 1 : 0) - boss.glance) * Math.min(1, dt * 3);
    boss.look = busy ? boss.target : reading && boss.clipAt ? boss.clipAt : null;
    boss.curious = !reading;
    boss.want = { shift: 0.25 };

    // ---- the onlooker follows the right crane's hook
    const rk = cranes[1], hk = hookAt(rk);
    turnTo(watcher, toward(watcher, hk), dt, 0.8);
    watcher.look = hk;

    boss.busy = boss.pw > 0.02 || boss.nodT < 1 || Math.abs(boss.glance - (reading ? 1 : 0)) > 0.02;
    for (const p of signals) p.busy = p.raise > 0.02 || p.beck > 0.02 || p.cheer > 0.02;
    pusher.busy = pusher.hold > 0.02 || Math.abs(barrow.tip) > 0.01;
    shovel.busy = shovel.cyc > 0 || shovel.grip > 0.02;
    carrier.busy = carrier.bag || !!carrier.route[carrier.ri].act;
    for (const p of people) {
      life(p, dt);
      p.calm = !p.busy && p.walk < 0.03 && !p.feet[0].sw && !p.feet[1].sw;
    }
  }

  return {
    people, barrow, update: updatePeople,
    draw() {
      // When frames come slower than about 50 a second, the crew takes turns: each body is redrawn every
      // other frame, and one only breathing and shifting its weight every fourth. A still frame draws all.
      tick++;
      frameDt += (simDt - frameDt) * 0.1; simDt = 0;
      const all = ctx.still(), slow = frameDt > 1 / 50;
      people.forEach((p, i) => {
        const every = p.calm ? (slow ? 4 : 2) : slow ? 2 : 1;
        if (all || !p.drawn || (tick + i) % every === 0) { drawPerson(p); p.drawn = true; }
      });
      drawBarrow(barrow);
    },
  };
}

/**
 * Construction 404. A 404 built of blocks, broken: the missing blocks lie on
 * the ground in front of it, and two tower cranes lift them back into their
 * places while a crew works the site below. A manager points the work out,
 * a signalman walks with each crane, a shoveler loads a wheelbarrow from the
 * sand pile, the barrow runs to the mixer, and a labourer carries cement bags
 * to it. When the last block is set the sign lights up, shakes, and breaks
 * again, and the work starts over.
 *
 * Any block in place can be knocked out: click or tap it, or pick it with the
 * arrow keys and press Enter. It falls with every block stacked on it, and
 * its crane puts them back, always from the bottom of a column up.
 *
 * Drawn on the Hairline kernel (HL). The scene is split by part: core (camera,
 * layout, layers, helpers), ground, blocks, cranes and people; this file holds
 * the story, the frame loop and the reader's input.
 *
 * construction404(stage, svg, opts) → { destroy, aspect, knock, where, advance, snapshot, time }
 *   stage       the element carrying data-hairline; it gets the pointer and the keys
 *   svg         an <svg> inside it; the scene sets its viewBox
 *   opts.frame  "full" (the whole site, about 16:9) or "core" (the 404 and both cranes, for a tall screen)
 *   opts.t      seconds to run the site forward before the first frame
 *   opts.freeze draw that one frame and stop
 *   opts.onRead     a short status: "fixing 3/8", "fixed", "breaking"
 *   opts.onAnnounce a sentence for a live region, after something the reader did
 *   opts.onKnock    the number of blocks the reader has knocked out
 *   opts.onSound    { kind: "impact" | "set", strength 0..1, pan -1..1 } when a block hits the ground or is set down
 *   aspect      the viewBox's width over its height, for sizing the stage
 */
function construction404(stage, svg, opts = {}) {
  const { register, disposer, reducedMotion, rad, clamp, TAU } = { ...HL, TAU: Math.PI * 2 };
  const bag = disposer();
  const noop = () => {};
  const onRead = opts.onRead || noop, onAnnounce = opts.onAnnounce || noop, onKnock = opts.onKnock || noop, onSound = opts.onSound || noop;

  const ctx = siteCore(svg, opts);
  const { VW, VH, SZ, S, slots, slotAt, broken, items, layer, story, still } = ctx;
  const B = siteBlocks(ctx), G = siteGround(ctx), CR = siteCranes(ctx, B);
  ctx.cranes = CR.cranes;
  const PE = sitePeople(ctx, B, CR);
  const { blocks, isIn, isOut, clear, taken, findSpot } = B;
  const cranes = CR.cranes;

  // ---------------------------------------------------------------- the story
  const craneFor = (s) => cranes.find((k) => k.take(s.col));

  /** Knocks the block in slot s out, with every block standing on it in its column. Returns how many fell. */
  function knockOut(s, o = {}) {
    if (s.block.state !== "slot") return 0;
    const stack = slots.filter((q) => q.col === s.col && q.lvl >= s.lvl && q.block.state === "slot").sort((a, b) => a.lvl - b.lvl);
    stack.forEach((q, i) => {
      const b = q.block, spot = !o.byReader && q.spot && clear(q.spot[0], q.spot[1], taken()) ? q.spot : findSpot(q, craneFor(q));
      story.seq++;
      if (still()) { Object.assign(b, { state: "ground", x: spot[0], y: spot[1], z: 0, yaw: rad(spot[2]) }); return; }
      b.state = "falling";
      b.fall = { t: -((o.delay || 0) + i * 0.12), x0: q.cx, y0: q.cy, z0: q.z0, x1: spot[0], y1: spot[1], yaw: rad(spot[2]) + (story.seq % 2 ? TAU : -TAU) * 0.5, dur: 0.75 + q.z0 / 160 };
    });
    story.lost += stack.length;
    if (story.phase !== "repair") { story.phase = "repair"; story.pt = 0; }
    if (o.byReader) {
      story.knocked += stack.length; story.byReader = true;
      onKnock(story.knocked);
      const one = stack.length === 1;
      onAnnounce(still()
        ? (one ? "You knocked out a block. Press Enter or tap its outline to put it back." : `You knocked out ${stack.length} blocks. Press Enter or tap an outline to put them back.`)
        : (one ? "You knocked out a block. A crane will put it back." : `You knocked out ${stack.length} blocks. A crane will put them back.`));
    }
    return stack.length;
  }

  /**
   * Without motion there is no crane to watch, so a block that is out goes straight back, with every block
   * out below it in its column, so nothing is ever set above a gap. A crane that had one of them as its job lets go.
   */
  function putBack(s) {
    const run = slots.filter((q) => q.col === s.col && q.lvl <= s.lvl && q.block.state !== "slot").sort((a, b) => a.lvl - b.lvl);
    for (const q of run) {
      const b = q.block;
      for (const k of cranes) if (k.job === b) Object.assign(k, { job: null, mode: null, spot: null, steps: [], cur: null });
      Object.assign(b, { state: "slot", x: q.cx, y: q.cy, z: q.z0, yaw: 0, fall: null });
      story.placed++;
    }
    onAnnounce(run.length === 1 ? "The block is back in place." : `${run.length} blocks are back in place.`);
  }

  function director(dt) {
    story.pt += dt;
    if (story.phase === "repair" && story.lost > 0 && blocks.every((b) => b.state === "slot")) {
      Object.assign(story, { phase: "fixed", pt: 0, lost: 0, placed: 0 });
      if (story.byReader) { story.byReader = false; onAnnounce("Every block is back in place."); }
    } else if (story.phase === "fixed" && story.pt > 3.6) { story.phase = "shake"; story.pt = 0; }
    else if (story.phase === "shake" && story.pt > 0.8) {
      story.phase = "repair"; story.pt = 0;
      broken.slice().sort((a, b) => b.lvl - a.lvl || a.col - b.col).forEach((q, i) => knockOut(q, { delay: i * 0.11 }));
    }
  }

  // ---- what the site sounds like: a block meeting the ground, read from the blocks' own motion
  let audible = false;
  const pan = (b) => clamp((ctx.P(b.x, b.y, 0)[0] / VW) * 2 - 1, -1, 1) * 0.8;
  function listen(before, dt) {
    if (!audible) return;
    for (const b of blocks) {
      const was = before.get(b);
      if (b.state === "falling") {
        // a falling block's first touch of the ground, and any bounce after it, by how fast it came down
        const pz = b.__pz ?? b.z, vz = (pz - b.z) / dt;
        if (b.z <= 0.6 && pz > 0.6 && vz > 2) onSound({ kind: "impact", strength: clamp(vz / 70, 0.15, 1), pan: pan(b) });
        b.__pz = b.z;
      } else b.__pz = undefined;
      if (was === "carried" && b.state !== "carried") onSound({ kind: "set", strength: 0.3, pan: pan(b) });
    }
  }

  function sim(dt) {
    const before = audible ? new Map(blocks.map((b) => [b, b.state])) : null;
    story.clock += dt;
    director(dt);
    CR.update(dt);
    B.update(dt);
    PE.update(dt);
    G.update(dt);
    listen(before, dt);
  }

  let read = "";
  function draw() {
    if (hover && !isIn(hover)) { hover = null; stage.style.cursor = ""; }
    B.draw(active());
    CR.draw();
    PE.draw();
    G.draw();
    // repaint in depth order, only when the order changed
    let sorted = true;
    for (let i = 1; i < items.length; i++) if (items[i].key < items[i - 1].key) { sorted = false; break; }
    if (!sorted) { items.sort((a, b) => a.key - b.key); for (const it of items) layer.appendChild(it.g); }
    const text = story.phase === "fixed" ? "fixed" : story.phase === "shake" ? "breaking" : `fixing ${story.placed}/${story.lost}`;
    if (text !== read) { read = text; onRead(text); }
  }

  // ---------------------------------------------------------------- life
  const advance = (sec) => { let left = sec; while (left > 1e-6) { const h = Math.min(left, 1 / 90); sim(h); left -= h; } };
  advance(Math.max(0, opts.t || 0));
  // a still with both cranes at work; the kernel learns about reduced motion only inside register, so ask directly too
  const prefersStill = reducedMotion() || (typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (prefersStill && !opts.t) advance(8.6);
  // the block under the pointer, and the one picked with the keys
  let hover = null, sel = null;
  const active = () => hover || sel;
  // register draws the first frame at once; the kernel clamps dt to 50ms
  const loop = register(stage, (dt) => {
    if (still()) { draw(); return false; }
    audible = true;       // only the live clock makes sound, never a skip ahead
    advance(dt);
    audible = false;
    draw();
    return true;
  });
  bag.add(loop.unregister);
  const poke = () => { if (still()) draw(); else loop.wake(); };

  // ---- the reader's hand: hover marks a block, a press knocks it out
  const inside = (poly, [x, y]) => {
    let sign = 0;
    for (let i = 0; i < poly.length; i++) {
      const [ax, ay] = poly[i], [bx, by] = poly[(i + 1) % poly.length], c = (bx - ax) * (y - ay) - (by - ay) * (x - ax);
      if (c) { if (!sign) sign = Math.sign(c); else if (Math.sign(c) !== sign) return false; }
    }
    return true;
  };
  /** The nearest slot whose rest pose holds the point; a finger also gets the nearest within half a block. */
  function slotAtPoint(p, want, finger) {
    let best = null;
    for (const s of slots) if (want(s) && inside(s.hit, p) && (!best || s.key > best.key)) best = s;
    if (best || !finger) return best;
    let d0 = 0.75 * SZ * S;
    for (const s of slots) { const d = want(s) && Math.hypot(p[0] - s.mid[0], p[1] - s.mid[1]); if (d !== false && d < d0) { best = s; d0 = d; } }
    return best;
  }
  const toView = (e) => {
    const m = svg.getScreenCTM();
    if (!m) return [-1, -1];
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    return [q.x, q.y];
  };
  const setHover = (s) => { if (s !== hover) { hover = s; stage.style.cursor = s ? "pointer" : ""; poke(); } };

  bag.on(stage, "pointermove", (e) => { if (e.pointerType === "mouse") setHover(slotAtPoint(toView(e), isIn, false)); });
  bag.on(stage, "pointerleave", () => setHover(null));
  bag.on(stage, "pointerdown", (e) => {
    if (e.button !== 0) return;
    const p = toView(e), finger = e.pointerType !== "mouse";
    // the outline under the point decides; a finger's nearest-block guess comes only after both outlines miss
    const exactIn = slotAtPoint(p, isIn, false), exactOut = !exactIn && still() ? slotAtPoint(p, isOut, false) : null;
    const s = exactIn || (!exactOut && finger ? slotAtPoint(p, isIn, true) : null);
    if (s) { knockOut(s, { byReader: true }); hover = null; stage.style.cursor = ""; poke(); return; }
    const g = exactOut || (still() && finger ? slotAtPoint(p, isOut, true) : null);
    if (g) { putBack(g); poke(); }
  });

  // ---- the keys: arrows walk the blocks, Enter or Space knocks one out
  const DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] };
  function walk(from, [dc, dl] = [0, 0]) {
    if (!from) return slots.filter(isIn).sort((a, b) => Math.hypot(a.col - 5, a.lvl - 2) - Math.hypot(b.col - 5, b.lvl - 2))[0] || slots[0];
    let best = null, score = 0;
    for (const s of slots) {
      const along = dc ? (s.col - from.col) * dc : (s.lvl - from.lvl) * dl, across = dc ? Math.abs(s.lvl - from.lvl) : Math.abs(s.col - from.col);
      if (along <= 0) continue;
      const sc = along + across * 3;
      if (!best || sc < score) { best = s; score = sc; }
    }
    return best || from;
  }
  const say = (s) => onAnnounce(isIn(s) ? "Block in place. Press Enter to knock it out." : still() ? "Block out. Press Enter to put it back." : "Block out. A crane will put it back.");
  bag.on(stage, "keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (DIRS[e.key]) { e.preventDefault(); if (hover) setHover(null); sel = walk(sel, DIRS[e.key]); say(sel); poke(); return; }
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (hover) setHover(null);
      if (!sel) { sel = walk(null); say(sel); }
      else if (isIn(sel)) knockOut(sel, { byReader: true });
      else if (still() && isOut(sel)) putBack(sel);
      else say(sel);
      poke();
      return;
    }
    if (e.key === "Escape" && sel) { sel = null; poke(); }
  });
  bag.on(stage, "blur", () => { if (sel) { sel = null; poke(); } });
  bag.add(() => { svg.replaceChildren(); stage.style.cursor = ""; });

  return {
    destroy: bag.dispose,
    aspect: VW / VH,
    time: () => story.clock,
    /** Knocks out the block at a column and level, as a press would. Returns how many fell. */
    knock: (col, lvl) => { const s = slotAt(col, lvl), n = s ? knockOut(s, { byReader: true }) : 0; poke(); return n; },
    /** Where a block's rest pose sits, in viewBox units. */
    where: (col, lvl) => { const s = slotAt(col, lvl); return s ? s.mid.slice() : null; },
    /** Runs the site forward, for tests and for skipping ahead. */
    advance: (sec) => { advance(sec); draw(); },
    snapshot: () => ({
      phase: story.phase, lost: story.lost, placed: story.placed, knocked: story.knocked,
      blocks: blocks.map((b) => ({ col: b.slot.col, lvl: b.slot.lvl, state: b.state, x: b.x, y: b.y })),
      cranes: cranes.map((k) => ({ job: k.job && `${k.job.slot.col},${k.job.slot.lvl}`, mode: k.mode, h: k.h })),
    }),
  };
}
</script>
<script id="site-sound">
/**
 * The site's sound: a construction ambience on a loop at 60%, and a brick
 * hitting concrete each time a block lands, softer when a crane sets one down.
 * It stays off until the reader turns it on (browsers start audio only after a
 * press), and remembers their choice for the next visit.
 *
 * siteSound({ ambience, impact }) → { on, setOn(on), play(event) }
 *   event   what the scene reports: { kind: "impact" | "set", strength 0..1, pan -1..1 }
 *
 * Web Audio plays both files where it can fetch them. Opened from disk, where a
 * fetch is refused, plain audio elements stand in.
 */
function siteSound(files) {
  /** The impact recording holds six separate hits: [offset, length] in seconds. Each landing takes the next. */
  const HITS = [[0, 0.9], [2.19, 0.62], [4.0, 0.72], [5.96, 0.62], [7.93, 0.44], [9.61, 0.74]];
  const AMBIENCE = 0.6, KEY = "construction404:sound";
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac = null, master = null, bed = null, loop = null, bufs = null, loading = null, fb = null;
  let on = false, turn = 0, voices = 0, last = -1;

  const ramp = (param, to, sec) => {
    const t = ac.currentTime;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(to, t + sec);
  };

  function graph() {
    if (ac || !AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    bed = ac.createGain(); bed.gain.value = 0; bed.connect(master);
  }
  const decode = (url) => fetch(url)
    .then((r) => { if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.arrayBuffer(); })
    .then((data) => new Promise((ok, fail) => ac.decodeAudioData(data, ok, fail)));
  function load() {
    if (!loading) {
      loading = Promise.all([decode(files.ambience), decode(files.impact)])
        .then(([a, i]) => { bufs = { a, i }; })
        .catch(() => { fallback(); });
    }
    return loading;
  }
  function fallback() {
    if (fb) return;
    const bedEl = new Audio(files.ambience);
    bedEl.loop = true; bedEl.volume = AMBIENCE;
    fb = { bed: bedEl, pool: Array.from({ length: 4 }, () => new Audio(files.impact)), next: 0 };
  }
  function startBed() {
    if (bufs && !loop) {
      loop = ac.createBufferSource();
      loop.buffer = bufs.a; loop.loop = true; loop.connect(bed);
      loop.start();
      ramp(bed.gain, AMBIENCE, 1.5);
    } else if (fb) fb.bed.play().catch(() => {});
  }

  const store = (v) => { try { localStorage.setItem(KEY, v ? "on" : "off"); } catch { /* private window: forget it */ } };
  const stored = () => { try { return localStorage.getItem(KEY) === "on"; } catch { return false; } };

  function setOn(v) {
    on = !!v;
    store(on);
    if (on) {
      graph();
      if (ac) {
        ac.resume();
        ramp(master.gain, 1, 0.4);
        load().then(() => { if (on) startBed(); });
      } else { fallback(); startBed(); }
    } else {
      if (ac) { ramp(master.gain, 0, 0.25); setTimeout(() => { if (!on) ac.suspend(); }, 320); }
      if (fb) fb.bed.pause();
    }
  }

  function play(e) {
    if (!on) return;
    const strength = Math.max(0, Math.min(1, e.strength ?? 0.5)), set = e.kind === "set";
    const [offset, length] = HITS[turn++ % HITS.length];
    const vol = set ? 0.4 : 0.35 + 0.65 * strength;
    if (bufs && ac && ac.state === "running") {
      const t = ac.currentTime;
      // a pile of blocks landing together is one crash, not a machine gun
      if (voices >= 6 || (t - last < 0.05 && strength < 0.7)) return;
      last = t;
      const src = ac.createBufferSource(), gain = ac.createGain();
      src.buffer = bufs.i;
      const rate = (set ? 0.82 : 0.93) + ((turn * 0.137) % 0.14);
      src.playbackRate.value = rate;
      const end = t + length / rate;
      gain.gain.setValueAtTime(vol, t);
      gain.gain.setValueAtTime(vol, end - 0.08);
      gain.gain.linearRampToValueAtTime(0, end);
      src.connect(gain);
      if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = e.pan || 0; gain.connect(p); p.connect(master); }
      else gain.connect(master);
      voices++;
      src.onended = () => { voices--; };
      src.start(t, offset, length);
    } else if (fb) {
      const el = fb.pool[fb.next++ % fb.pool.length];
      try { el.currentTime = offset; } catch { /* not loaded yet */ }
      el.volume = Math.min(1, vol);
      el.play().catch(() => {});
      clearTimeout(el.stopAt);
      el.stopAt = setTimeout(() => el.pause(), length * 1000);
    }
  }

  // Hidden tabs go quiet; coming back resumes only if the reader left it on.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (ac) ac.suspend(); if (fb) fb.bed.pause(); }
    else if (on) { if (ac) ac.resume(); if (fb) fb.bed.play().catch(() => {}); }
  });

  return { get on() { return on; }, wanted: stored(), setOn, play };
}
</script>
<script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    if (["light", "dark"].includes(params.get("theme"))) document.documentElement.dataset.theme = params.get("theme");

    HL.inject(document);
    const stage = $("stage"), live = $("live"), toggle = $("sound");

    // Sound starts off. A reader who left it on last time hears it from their first press anywhere.
    const sound = siteSound({ ambience: "audio/ambience.mp3", impact: "audio/impact.mp3" });
    const show = (on) => toggle.setAttribute("aria-pressed", String(on));
    toggle.addEventListener("click", () => { sound.setOn(!sound.on); show(sound.on); });
    if (sound.wanted) {
      show(true);
      const wake = (e) => {
        removeEventListener("pointerdown", wake, true); removeEventListener("keydown", wake, true);
        if (e.target.closest && e.target.closest("#sound")) return; // the toggle handles its own press
        if (!sound.on && toggle.getAttribute("aria-pressed") === "true") sound.setOn(true);
      };
      addEventListener("pointerdown", wake, true); addEventListener("keydown", wake, true);
    }
    const svg = HL.mk("svg", { "aria-hidden": "true" }, stage);

    // A tall screen gets the 404 and its cranes up close; a wide one gets the whole site.
    const frameFor = () => params.get("frame") || (innerWidth < innerHeight ? "core" : "full");
    let site = null, frame = "";
    function mount() {
      if (site) site.destroy();
      frame = frameFor();
      site = construction404(stage, svg, {
        frame,
        t: Number(params.get("t")) || 0,
        freeze: params.has("freeze"),
        onAnnounce: (text) => { live.textContent = text; },
        onSound: (e) => sound.play(e),
      });
      stage.dataset.frame = frame;
      stage.style.setProperty("--aspect", site.aspect.toFixed(4));
      if (params.has("test")) window.site = site;
    }
    mount();
    let wait = 0;
    addEventListener("resize", () => {
      clearTimeout(wait);
      wait = setTimeout(() => { if (frameFor() !== frame) mount(); }, 150);
    });
  })();
</script>
</body>
