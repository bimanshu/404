<title>Page not found</title>
<style>
  /* Layout: the site alone, centred in the viewport, as large as its shape allows up to 80% of the height.
     On a tall screen it runs edge to edge. */
  :root {
    color-scheme: light;
    /* neutrals carry a slight cool bias (hue 260) so the greys read as one family */
    --bg: oklch(0.985 0.003 255);         /* page, and every plate in the drawing */
    --ink: oklch(0.24 0.012 260);         /* the line, the 404's edges, the one highlight */
    --line-edge: oklch(0.63 0.012 260);   /* silhouettes of everything else */
    --line-mid: oklch(0.79 0.008 260);    /* inner strokes */
    --line-lo: oklch(0.9 0.005 260);      /* what recedes */
    --block-face: oklch(0.87 0.006 260);  /* the blocks' sides */
    --block-top: oklch(0.94 0.004 260);   /* the blocks' tops, lit from above */
    --block-shade: oklch(0.8 0.007 260);  /* the blocks' sides that face away from the light */
    --loose-face: oklch(0.78 0.008 260);  /* a block a press would knock out */
    --loose-top: oklch(0.86 0.006 260);
    --loose-shade: oklch(0.72 0.009 260);
    /* surface tones for shading, from in shade (1) to lit (6); the scene picks them by a face's normal */
    --tone-1: oklch(0.76 0.008 260); --tone-2: oklch(0.82 0.007 260); --tone-3: oklch(0.87 0.006 260);
    --tone-4: oklch(0.91 0.005 260); --tone-5: oklch(0.945 0.004 260); --tone-6: oklch(0.975 0.003 255);
    --hivis: oklch(0.97 0.004 255);       /* reflective vests and hard hats: the brightest cloth */
    --shadow: oklch(0.45 0.01 260);       /* contact shadows, faded by the scene */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: oklch(0.16 0.004 260); --ink: oklch(0.9 0.008 255);
      --line-edge: oklch(0.48 0.01 260); --line-mid: oklch(0.35 0.008 260); --line-lo: oklch(0.27 0.006 260);
      --block-face: oklch(0.31 0.008 260); --block-top: oklch(0.39 0.008 260); --block-shade: oklch(0.255 0.007 260);
      --loose-face: oklch(0.43 0.01 260); --loose-top: oklch(0.52 0.01 260); --loose-shade: oklch(0.36 0.01 260);
      --tone-1: oklch(0.17 0.004 260); --tone-2: oklch(0.2 0.005 260); --tone-3: oklch(0.235 0.006 260);
      --tone-4: oklch(0.27 0.007 260); --tone-5: oklch(0.32 0.008 260); --tone-6: oklch(0.38 0.009 260);
      --hivis: oklch(0.66 0.01 255); --shadow: oklch(0.06 0.004 260);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: oklch(0.16 0.004 260); --ink: oklch(0.9 0.008 255);
    --line-edge: oklch(0.48 0.01 260); --line-mid: oklch(0.35 0.008 260); --line-lo: oklch(0.27 0.006 260);
    --block-face: oklch(0.31 0.008 260); --block-top: oklch(0.39 0.008 260); --block-shade: oklch(0.255 0.007 260);
    --loose-face: oklch(0.43 0.01 260); --loose-top: oklch(0.52 0.01 260); --loose-shade: oklch(0.36 0.01 260);
    --tone-1: oklch(0.17 0.004 260); --tone-2: oklch(0.2 0.005 260); --tone-3: oklch(0.235 0.006 260);
    --tone-4: oklch(0.27 0.007 260); --tone-5: oklch(0.32 0.008 260); --tone-6: oklch(0.38 0.009 260);
    --hivis: oklch(0.66 0.01 255); --shadow: oklch(0.06 0.004 260);
  }

  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }

  main {
    min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center;
    padding-block: 2svh;
  }

  .stage {
    --aspect: 1.78;
    aspect-ratio: var(--aspect);
    width: min(calc(100% - 32px), calc(80vh * var(--aspect)));
    width: min(calc(100% - 32px), calc(80svh * var(--aspect)));
    max-width: 100%;
    border-radius: 12px;
    -webkit-tap-highlight-color: transparent;
    /* the drawing takes its strokes from the page's tokens, so its plates match the page */
    --hairline-plate: var(--bg); --hairline-hi: var(--ink); --hairline-edge: var(--line-edge);
    --hairline-mid: var(--line-mid); --hairline-lo: var(--line-lo);
  }
  .stage[data-frame="core"] { width: min(100%, calc(80svh * var(--aspect))); border-radius: 0; }
  .stage .blk { fill: var(--block-face); }
  .stage .blk-top { fill: var(--block-top); }
  .stage .loose .blk { fill: var(--loose-face); }
  .stage .loose .blk-top { fill: var(--loose-top); }
  .stage .blk-shade { fill: var(--block-shade); }
  .stage .loose .blk-shade { fill: var(--loose-shade); }
  .stage .t1 { fill: var(--tone-1); } .stage .t2 { fill: var(--tone-2); } .stage .t3 { fill: var(--tone-3); }
  .stage .t4 { fill: var(--tone-4); } .stage .t5 { fill: var(--tone-5); } .stage .t6 { fill: var(--tone-6); }
  .stage .hv { fill: var(--hivis); }
  .stage .shade-stop { stop-color: var(--shadow); }

  /* the one control: sound, in the top corner, clear of the site */
  .sound {
    position: fixed; z-index: 2;
    inset-block-start: calc(env(safe-area-inset-top, 0px) + 16px);
    inset-inline-end: calc(env(safe-area-inset-right, 0px) + 16px);
    inline-size: 44px; block-size: 44px; padding: 0;
    display: grid; place-items: center;
    border: 1px solid var(--line-lo); border-radius: 999px;
    background: var(--bg); color: var(--line-edge); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 160ms ease, border-color 160ms ease;
  }
  .sound:hover { color: var(--ink); border-color: var(--line-mid); }
  .sound:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .sound[aria-pressed="true"] { color: var(--ink); border-color: var(--line-mid); }
  .sound svg { inline-size: 20px; block-size: 20px; }
  .sound .when-on, .sound[aria-pressed="true"] .when-off { display: none; }
  .sound[aria-pressed="true"] .when-on { display: inline; }
  @media (prefers-reduced-motion: reduce) { .sound { transition: none; } }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
</style>
<!-- body -->
<button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Sound">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/>
    <path class="when-on" d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/>
    <path class="when-off" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>
<main>
  <div class="stage" id="stage" data-hairline="construction-404" role="img" tabindex="0"
       aria-label="Page not found. A broken 404 built of blocks, with two tower cranes putting the missing blocks back. Click or tap a block to knock it out, or use the arrow keys to pick one and press Enter."></div>
  <h1 class="sr-only">This page is under construction</h1>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<script id="hl-kernel">/*KERNEL*/</script>
<script id="construction-404">/*SCENE*/</script>
<script id="site-sound">/*SOUND*/</script>
<script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    if (["light", "dark"].includes(params.get("theme"))) document.documentElement.dataset.theme = params.get("theme");

    HL.inject(document);
    const stage = $("stage"), live = $("live"), toggle = $("sound");

    // Sound starts off. A reader who left it on last time hears it from their first press anywhere.
    const sound = siteSound({ ambience: "audio/ambience.mp3", impact: "audio/impact.mp3" });
    const show = (on) => toggle.setAttribute("aria-pressed", String(on));
    toggle.addEventListener("click", () => { sound.setOn(!sound.on); show(sound.on); });
    if (sound.wanted) {
      show(true);
      const wake = (e) => {
        removeEventListener("pointerdown", wake, true); removeEventListener("keydown", wake, true);
        if (e.target.closest && e.target.closest("#sound")) return; // the toggle handles its own press
        if (!sound.on && toggle.getAttribute("aria-pressed") === "true") sound.setOn(true);
      };
      addEventListener("pointerdown", wake, true); addEventListener("keydown", wake, true);
    }
    const svg = HL.mk("svg", { "aria-hidden": "true" }, stage);

    // A tall screen gets the 404 and its cranes up close; a wide one gets the whole site.
    const frameFor = () => params.get("frame") || (innerWidth < innerHeight ? "core" : "full");
    let site = null, frame = "";
    function mount() {
      if (site) site.destroy();
      frame = frameFor();
      site = construction404(stage, svg, {
        frame,
        t: Number(params.get("t")) || 0,
        freeze: params.has("freeze"),
        onAnnounce: (text) => { live.textContent = text; },
        onSound: (e) => sound.play(e),
      });
      stage.dataset.frame = frame;
      stage.style.setProperty("--aspect", site.aspect.toFixed(4));
      if (params.has("test")) window.site = site;
    }
    mount();
    let wait = 0;
    addEventListener("resize", () => {
      clearTimeout(wait);
      wait = setTimeout(() => { if (frameFor() !== frame) mount(); }, 150);
    });
  })();
</script>
