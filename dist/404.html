    const foot = rring(x, y, th, -3.8, -3.8, 3.8, 3.8, 1), head = rring(x, y, th, -1.1, -1.1, 1.1, 1.1, 0.5);
    setD(p.apex, poly(hull(ringAt(P, foot, H + 9).concat(ringAt(P, head, H + 34)))));
    putC(p.turn, rbox(x, y, th, -7, -7, 7, 7, H, H + 2.5, 2, 0.8));
    putC(p.cab, rbox(x, y, th, -1, 4, 8, 11, H + 2.5, H + 10.5, 1.4, 0.7));
    const winFace = c * sA + s * cA >= 0;
    setD(p.win, winFace ? poly([L(8.05, 5.4, H + 5), L(8.05, 9.6, H + 5), L(8.05, 9.6, H + 9), L(8.05, 5.4, H + 9)]) : "");
    putC(p.trolley, rbox(x, y, th, r - 4, -3.6, r + 4, 3.6, H - 1.4, H + 2.6, 1, 0.5));
    putC(p.jib, rbox(x, y, th, -4, -3, JIB, 3, H + 2.5, H + 9, 1, 0.6));
    setD(p.jl, zig(4, JIB - 4, 7.5, ns * 3, H + 3, H + 8.5));
    const A = P(x, y, H + 34);
    setD(p.ties, seg(A, L(70, 0, H + 9)) + seg(A, L(136, 0, H + 9)) + seg(A, L(-52, 0, H + 7.5)));

    // hook, cable, slings and load
    const tx = x + r * c, ty = y + r * s, hx = tx + k.sx, hy = ty + k.sy, h = k.h;
    const n = [-s * 1.1, c * 1.1];
    setD(k.cable, seg(P(tx + n[0], ty + n[1], H - 1.4), P(hx + n[0], hy + n[1], h + 6.5)) + seg(P(tx - n[0], ty - n[1], H - 1.4), P(hx - n[0], hy - n[1], h + 6.5)));
    putC(k.block, rbox(hx, hy, th, -2.6, -2.6, 2.6, 2.6, h + 1, h + 6.5, 1, 0.5));
    const H2 = (u, z) => P(hx + u * c, hy + u * s, z);
    setD(k.hook, open([H2(0, h + 1), H2(0, h - 1.2), H2(0.7, h - 2.5), H2(1.9, h - 2.6), H2(2.5, h - 1.6)]));
    const load = k.job && k.job.state === "carried" ? k.job : null;
    if (load) {
      const cc = Math.cos(load.yaw), ss = Math.sin(load.yaw), top = load.z + SZ, hk = P(hx, hy, h - 2);
      setD(k.sling, [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([u, v]) => seg(hk, P(load.x + 5.9 * u * cc - 3 * v * ss, load.y + 5.9 * u * ss + 3 * v * cc, top))).join(""));
    } else setD(k.sling, "");
    k.hookIt.key = depth(hx, hy) + 0.02 + (load ? load.z * 1e-3 : 0);
  }

  /** The trolley's radius and the jib's angle that put the hook over (px, py). */
  const polar = (k, px, py) => [Math.atan2(py - k.y, px - k.x), Math.hypot(px - k.x, py - k.y)];

  const hookAt = (k) => [k.x + k.r * Math.cos(k.th) + k.sx, k.y + k.r * Math.sin(k.th) + k.sy];

  /** The next block for this crane: one on the ground, in its columns, that can go back now; lowest first, then nearest. */
  function pickJob(k) {
    const [hx, hy] = hookAt(k);
    let best = null, score = 0;
    for (const b of blocks) {
      if (b.state !== "ground" || !k.take(b.slot.col) || !placeable(b.slot)) continue;
      const sc = b.slot.lvl * 40 + Math.hypot(b.x - hx, b.y - hy);
      if (!best || sc < score) { best = b; score = sc; }
    }
    return best;
  }

  function planJob(k, b) {
    const s = b.slot, [pt, pr] = polar(k, b.x, b.y), [st, sr] = polar(k, s.cx, s.cy);
    k.job = b; k.mode = "place";
    k.steps.push(
      { h: SAFE }, { th: pt, r: pr }, { h: HOOK_GROUND, low: true },
      { wait: 0.6, low: true, then: () => { b.state = "carried"; } },
      { h: SAFE }, { th: st, r: sr }, { h: s.z0 + SZ + 2 + SL, low: true },
      { wait: 0.5, low: true, then: () => { Object.assign(b, { state: "slot", x: s.cx, y: s.cy, z: s.z0, yaw: 0 }); k.job = null; k.mode = null; story.placed++; } },
      { h: SAFE },
    );
  }

  /** A block below the job's slot was knocked out: drop a job not yet hooked, or set the load down on the ground. */
  function abandon(k) {
    const b = k.job;
    k.steps = [];
    if (b.state !== "carried") { k.job = null; k.mode = null; return; }
    const spot = findSpot(b.slot, k), [th, r] = polar(k, spot[0], spot[1]);
    k.mode = "setdown"; k.spot = spot;
    k.steps.push(
      { h: SAFE }, { th, r }, { h: HOOK_GROUND, low: true },
      { wait: 0.5, low: true, then: () => { Object.assign(b, { state: "ground", z: 0 }); k.job = null; k.mode = null; k.spot = null; } },
      { h: SAFE },
    );
  }

  const parked = (k) => Math.abs(wrap(k.park - k.th)) < 0.01 && Math.abs(k.r - 64) < 0.5 && Math.abs(k.h - SAFE) < 0.5;

  function craneStep(k, dt) {
    // an idle wait gives way at once to new work
    if (k.cur && k.cur.idle && story.clock > 0.8 && pickJob(k)) k.cur = null;
    if (!k.cur) {
      if (!k.steps.length) {
        const b = story.clock > 0.8 ? pickJob(k) : null;
        if (b) planJob(k, b);
        else if (!parked(k)) k.steps.push({ h: SAFE }, { th: k.park, r: 64 });
        else k.steps.push({ wait: 0.3, idle: true });
      }
      const st = k.steps.shift();
      st.t = 0;
      st.f = { th: k.th, r: k.r, h: k.h };
      if (st.th != null) { st.dth = wrap(st.th - k.th); st.dur = Math.max(0.9, 0.6 + Math.abs(st.dth) * 1.1 + Math.abs(st.r - k.r) / 90); }
      else if (st.h != null) st.dur = Math.max(0.5, 0.35 + Math.abs(st.h - k.h) / 55);
      else st.dur = st.wait;
      k.cur = st;
    }
    const st = k.cur;
    st.t += dt;
    const e = smooth(clamp(st.t / st.dur, 0, 1));
    if (st.th != null) { k.th = st.f.th + st.dth * e; k.r = lerp(st.f.r, st.r, e); }
    if (st.h != null) k.h = lerp(st.f.h, st.h, e);
    if (st.t >= st.dur) {
      k.cur = null;
      // checked at every step's end, before its hook or release runs
      if (k.mode === "place" && !placeable(k.job.slot)) { abandon(k); return; }
      if (st.then) st.then();
    }
  }

  /** The load swings on its cable: a pendulum driven by the trolley's acceleration, held still near the ground. */
  function swing(k, dt) {
    const tx = k.x + k.r * Math.cos(k.th), ty = k.y + k.r * Math.sin(k.th);
    if (!k.tp) k.tp = [tx, ty];
    const vx = (tx - k.tp[0]) / dt, vy = (ty - k.tp[1]) / dt, ax = (vx - k.tv[0]) / dt, ay = (vy - k.tv[1]) / dt;
    k.tp = [tx, ty]; k.tv = [vx, vy];
    const damp = k.h < SAFE - 8 ? 7 : 0.9;
    k.svx += (-9 * k.sx - damp * k.svx - clamp(ax, -400, 400)) * dt;
    k.svy += (-9 * k.sy - damp * k.svy - clamp(ay, -400, 400)) * dt;
    k.sx = clamp(k.sx + k.svx * dt, -6, 6);
    k.sy = clamp(k.sy + k.svy * dt, -6, 6);
    const b = k.job;
    if (b && b.state === "carried") {
      b.x = tx + k.sx; b.y = ty + k.sy; b.z = k.h - 2 - SL - SZ;
      b.yaw = wrap(b.yaw) * Math.max(0, 1 - dt * 1.4);
    }
  }

  const cranes = CRANES.map(makeCrane);
  if (depth(cranes[0].x, cranes[0].y) > depth(cranes[1].x, cranes[1].y)) tops.appendChild(cranes[0].top);

  return {
    cranes, polar, hookAt,
    update(dt) { for (const k of cranes) { craneStep(k, dt); swing(k, dt); } },
    draw() { for (const k of cranes) drawCrane(k); },
  };
}

/** The crew: a manager, a signalman for each crane, an onlooker, a shoveler, a barrow and its pusher, and a labourer with cement bags. */
function sitePeople(ctx, B, CR) {
  const {
    rrect, ringAt, run, hull, poly, open, seg, clamp, rad, r2, mk, solid, place, sA, cA, depth, front, TAU, wrap,
    smooth, lerpA, PILE, MIXER, PALLET, LOAD, DUMP, BOSS, P, S, P3, ground, layer, item, setD, flag, putC, rring,
    rbox, v3, frame, story,
  } = ctx;
  const { cranes } = CR;

  // ---------------------------------------------------------------- people
  const HEAD = 2.2;
  function makePerson(x, y, f, o = {}) {
    const g = mk("g", {}, layer);
    const p = { x, y, f, phase: 0, amp: 0, moving: false, speed: o.speed || 20, boss: !!o.boss, arms: null, extra: null, it: item(g) };
    p.legA = mk("path", { class: "nf sil" }, g);
    p.legB = mk("path", { class: "nf sil" }, g);
    p.back = mk("g", {}, g);
    p.armA = mk("path", { class: "nf sil" }, g);
    p.torso = mk("path", { class: "sil" }, g);
    p.vest = mk("path", { class: "nf" }, g);
    p.head = mk("ellipse", { class: "sil", rx: r2(HEAD * S), ry: r2(HEAD * S) }, g);
    p.hat = mk("path", { class: o.boss ? "hi" : "sil" }, g);
    p.armB = mk("path", { class: "nf sil" }, g);
    p.front = mk("g", {}, g);
    return p;
  }

  function drawPerson(p) {
    const Wd = frame(p.x, p.y, p.f), W = (u, v, z) => P3(Wd(u, v, z));
    const sf = Math.sin(p.f), cf = Math.cos(p.f);
    const near = -sf * sA + cf * cA >= 0 ? 1 : -1;
    const leg = (s) => {
      const ph = p.phase + (s > 0 ? 0 : Math.PI), fu = 2.6 * p.amp * Math.sin(ph), fz = 1.4 * p.amp * Math.max(0, Math.cos(ph));
      return open([W(0, s * 1.1, 8.8), W(fu * 0.5 + 0.6 * p.amp, s * 1.15, 4.6 + fz * 0.6), W(fu, s * 1.2, fz)]);
    };
    setD(p.legA, leg(-near));
    setD(p.legB, leg(near));
    const arm = (s) => {
      const own = p.arms && p.arms(s, Wd);
      const sh = W(0, s * 2.5, 15.8);
      if (own) return open([sh, ...own.map(P3)]);
      const ph = p.phase + (s > 0 ? Math.PI : 0), sw = 2.3 * p.amp * Math.sin(ph);
      return open([sh, W(sw * 0.45 - 0.2, s * 2.9, 12.6), W(sw, s * 3, 9.6)]);
    };
    setD(p.armA, arm(-near));
    setD(p.armB, arm(near));
    const ring = rring(p.x, p.y, p.f, -1.4, -2.4, 1.4, 2.4, 1.3);
    setD(p.torso, poly(hull(ringAt(P, ring, 8.6).concat(ringAt(P, ring, 16.6)))));
    setD(p.vest, p.boss ? "" : open(ringAt(P, run(ring, front), 12.8)));
    place(p.head, W(0, 0, 19.2));
    const hc = W(0.25, 0, 19.9), rx = 2.75 * S, ry = 2.3 * S, bw = rx + 1.1 * S;
    setD(p.hat, `M${r2(hc[0] - rx)} ${r2(hc[1])}A${r2(rx)} ${r2(ry)} 0 0 1 ${r2(hc[0] + rx)} ${r2(hc[1])}ZM${r2(hc[0] - bw)} ${r2(hc[1] + 0.2)}L${r2(hc[0] + bw)} ${r2(hc[1] + 0.2)}`);
    if (p.extra) p.extra(p, Wd, near);
    p.it.key = depth(p.x, p.y);
  }

  /** Moves a body one step toward (tx, ty): it turns first, then walks. True once it is there. */
  function walkTo(p, tx, ty, dt, speed = p.speed) {
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d < 0.5) { p.moving = false; return true; }
    const want = Math.atan2(dy, dx), off = Math.abs(wrap(want - p.f));
    turnTo(p, want, dt, 6);
    if (off < 1) {
      const step = Math.min(d, speed * dt * (1 - off * 0.5));
      p.x += (dx / d) * step; p.y += (dy / d) * step; p.phase += step * 0.42; p.moving = true;
    } else p.moving = false;
    return false;
  }
  const turnTo = (p, want, dt, rate = 4) => { p.f += clamp(wrap(want - p.f), -rate * dt, rate * dt); };
  const toward = (p, q) => Math.atan2(q[1] - p.y, q[0] - p.x);

  /** A route is a loop of steps: { to }, { face }, { wait }, { until }, each with an optional then. */
  function runRoute(p, dt) {
    const st = p.route[p.ri];
    let done = false;
    if (st.to) done = walkTo(p, st.to[0], st.to[1], dt);
    else {
      p.moving = false;
      if (st.face != null) { turnTo(p, st.face, dt); done = Math.abs(wrap(st.face - p.f)) < 0.04; }
      else if (st.wait != null) { p.wt = (p.wt || 0) + dt; done = p.wt >= st.wait; }
      else if (st.until) done = st.until();
    }
    if (done) { p.wt = 0; p.ri = (p.ri + 1) % p.route.length; if (st.then) st.then(); }
  }

  // ---- the wheelbarrow, pushed by one worker
  function makeBarrow() {
    const g = mk("g", {}, layer);
    const b = { x: 0, y: 0, f: 0, fill: 0, roll: 0, pitch: 0, it: item(g) };
    b.wheelA = mk("path", { class: "sil" }, g); b.spokeA = mk("path", { class: "nf" }, g);
    b.frame = mk("path", { class: "nf sil" }, g);
    b.tray = mk("path", { class: "sil" }, g);
    b.load = mk("path", {}, g);
    b.rim = mk("path", { class: "nf" }, g);
    b.wheelB = mk("path", { class: "sil" }, g); b.spokeB = mk("path", { class: "nf" }, g);
    return b;
  }
  /** The barrow's own frame: u forward to the wheel, pitched about the axle so the legs lift when pushed. */
  const barrowFrame = (b) => {
    const W0 = frame(b.x, b.y, b.f), ca = Math.cos(b.pitch), sa = Math.sin(b.pitch);
    return (u, v, z) => { const du = u - 7.6, dz = z - 3.2; return W0(7.6 + du * ca + dz * sa, v, 3.2 + dz * ca - du * sa); };
  };
  const TRAY = { foot: rrect(-4.4, -2.6, 3.4, 2.6, 1.4), top: rrect(-6.8, -4.4, 5.4, 4.4, 2.2), inner: rrect(-6, -3.6, 4.6, 3.6, 1.6), heap: rrect(-3.8, -2.1, 2.4, 2.1, 1.8) };
  function drawBarrow(b) {
    const Wd = barrowFrame(b), W = (u, v, z) => P3(Wd(u, v, z)), cf = Math.cos(b.f), sf = Math.sin(b.f);
    const wheelNear = cf * sA + sf * cA > 0;
    const wheel = [];
    for (let i = 0; i < 22; i++) { const a = (i / 22) * TAU; wheel.push(W(7.6 + 3.2 * Math.cos(a), 0, 3.2 + 3.2 * Math.sin(a))); }
    const spokes = [0, 1].map((n) => { const a = b.roll + (n * Math.PI) / 2; return seg(W(7.6 + 3 * Math.cos(a), 0, 3.2 + 3 * Math.sin(a)), W(7.6 - 3 * Math.cos(a), 0, 3.2 - 3 * Math.sin(a))); }).join("");
    setD(b.wheelA, wheelNear ? "" : poly(wheel)); setD(b.spokeA, wheelNear ? "" : spokes);
    setD(b.wheelB, wheelNear ? poly(wheel) : ""); setD(b.spokeB, wheelNear ? spokes : "");
    let fr = "";
    for (const s of [-1, 1]) fr += open([W(7.6, s * 1.2, 3.2), W(-4.6, s * 2.8, 4.6), W(-12.6, s * 3.1, 8.2)]) + open([W(-3.2, s * 2.8, 4.6), W(-3.8, s * 3, 0)]);
    setD(b.frame, fr);
    const at = (ring, z) => ring.map((q) => W(q.u, q.v, z));
    setD(b.tray, poly(hull(at(TRAY.foot, 4.6).concat(at(TRAY.top, 9.8)))));
    const facesV = (q) => (q.nu * cf - q.nv * sf) * sA + (q.nu * sf + q.nv * cf) * cA >= 0;
    if (b.fill > 0.02) {
      setD(b.load, poly(hull(at(TRAY.inner, 9.8).concat(at(TRAY.heap, 9.8 + 3.4 * b.fill)))));
      setD(b.rim, open(at(run(TRAY.inner, facesV), 9.8)));
    } else { setD(b.load, ""); setD(b.rim, poly(at(TRAY.inner, 9.8))); }
    b.it.key = depth(b.x, b.y);
  }

  // the manager: clipboard in one hand, the other points at whatever is being set down
  const boss = makePerson(BOSS[0], BOSS[1], rad(-100), { boss: true });
  boss.pw = 0; boss.target = [66, 6, 40]; boss.home = rad(-100);
  boss.clip = mk("path", { class: "sil" }, boss.front);
  boss.arms = (s, Wd) => {
    if (s < 0) return [Wd(1, -3, 12.2), Wd(2.6, -1.8, 12.6)];
    const sh = Wd(0, 2.5, 15.8), d = v3.norm(v3.sub(boss.target, sh));
    const w = boss.pw;
    return [v3.lerp(Wd(-0.2, 2.9, 12.6), v3.add(sh, v3.mul(d, 3.7)), w), v3.lerp(Wd(0, 3, 9.6), v3.add(sh, v3.mul(d, 7.4)), w)];
  };
  boss.extra = (p, Wd) => {
    const facing = Math.cos(p.f) * sA + Math.sin(p.f) * cA >= 0, parent = facing ? p.front : p.back;
    if (p.clip.parentNode !== parent) parent.appendChild(p.clip);
    setD(p.clip, poly([Wd(2.4, -3.1, 11.6), Wd(3.1, -3.1, 15.2), Wd(3.1, 0.2, 15.2), Wd(2.4, 0.2, 11.6)].map(P3)));
  };

  // a signalman for each crane: walks to the block, raises an arm while the hook comes down
  const signals = cranes.map((k) => {
    const p = makePerson(k.home[0], k.home[1], rad(-100), { speed: 26 });
    p.k = k; p.raise = 0; p.cheer = 0; p.t = 0;
    p.arms = (s, Wd) => {
      const t = p.t * 9;
      if (p.cheer > 0.01) {
        const up = [Wd(0.3, s * 3.6, 19.6), Wd(0.2 + Math.sin(t + s) * 0.6, s * 3.3, 23.8)];
        return [v3.lerp(Wd(-0.2, s * 2.9, 12.6), up[0], p.cheer), v3.lerp(Wd(0, s * 3, 9.6), up[1], p.cheer)];
      }
      if (s > 0 || p.raise < 0.01) return null;
      const up = [Wd(0.4, -3.6, 19.6), Wd(0.4 + Math.sin(t) * 0.8, -3.1, 23.6)];
      return [v3.lerp(Wd(-0.2, -2.9, 12.6), up[0], p.raise), v3.lerp(Wd(0, -3, 9.6), up[1], p.raise)];
    };
    return p;
  });

  // the onlooker: hands on hips, watching the right crane
  const watcher = makePerson(212, 110, rad(-120));
  watcher.arms = (s, Wd) => [Wd(-0.6, s * 4.6, 12.8), Wd(0.2, s * 2.6, 10.2)];

  // the shoveler and the barrow he fills
  const barrow = makeBarrow();
  const pusher = makePerson(LOAD[0], LOAD[1], Math.PI, { speed: 20 });
  pusher.route = [
    { to: LOAD }, { face: Math.PI }, { until: () => barrow.fill >= 1 },
    { to: [120, 120] }, { to: DUMP }, { face: toward({ x: DUMP[0], y: DUMP[1] }, MIXER) },
    { wait: 1.4, then: () => { barrow.dumped = 1; } },
    { to: [120, 120] },
  ];
  pusher.ri = 0;
  /** The barrow rides 15.5 ahead of its pusher; its wheel turns with the distance. */
  const hitch = () => {
    const was = [barrow.x, barrow.y];
    barrow.f = pusher.f;
    barrow.x = pusher.x + Math.cos(pusher.f) * 15.5;
    barrow.y = pusher.y + Math.sin(pusher.f) * 15.5;
    barrow.roll += Math.hypot(barrow.x - was[0], barrow.y - was[1]) / 3.2;
  };
  hitch();
  pusher.arms = (s, Wd) => {
    const grip = barrowFrame(barrow)(-12.6, s * 3.1, 8.2), sh = Wd(0, s * 2.5, 15.8);
    return [v3.add(v3.lerp(sh, grip, 0.5), [0, 0, -1.2]), grip];
  };

  const shovel = makePerson(-30, 100, Math.PI);
  shovel.cyc = 0; shovel.tool = mk("path", { class: "nf sil" }, shovel.front); shovel.blade = mk("path", { class: "sil" }, shovel.front);
  shovel.sand = mk("ellipse", { class: "dot m", rx: r2(1.3 * S), ry: r2(0.8 * S) }, shovel.front);
  const SHOVEL = {
    dig: [[0.8, -2.2, 12.4], [6.8, -0.8, 1.6]], lift: [[0.6, -2.4, 13.4], [6.8, -0.6, 8.8]],
    toss: [[1.2, -2, 14], [7.4, -0.4, 12.6]], rest: [[1.6, -2.6, 14.4], [2.4, -3, 2.2]],
  };
  shovel.pose = SHOVEL.rest;
  shovel.arms = (s, Wd) => {
    const [G, N] = shovel.pose, at = s < 0 ? G : v3.lerp(G, N, 0.42);
    const hand = Wd(at[0], at[1], at[2]), sh = Wd(0, s * 2.5, 15.8);
    return [v3.add(v3.lerp(sh, hand, 0.5), [0, 0, -1.4]), hand];
  };
  shovel.extra = (p, Wd) => {
    const [G, N] = p.pose, d = v3.norm(v3.sub(N, G)), g = Wd(G[0], G[1], G[2]), n = Wd(N[0], N[1], N[2]);
    const tip = v3.add(N, v3.mul(d, 4.2));
    const bl = [Wd(N[0], N[1] + 1.7, N[2]), Wd(tip[0], tip[1] + 1.4, tip[2]), Wd(tip[0], tip[1] - 1.4, tip[2]), Wd(N[0], N[1] - 1.7, N[2])];
    setD(p.tool, seg(P3(g), P3(n)));
    setD(p.blade, poly(bl.map(P3)));
    const full = p.cyc > 0.22 && p.cyc < 0.66;
    flag(p.sand, "off", !full);
    p.sand.setAttribute("rx", full ? r2(1.3 * S) : "0");
    place(p.sand, P3(Wd(...v3.add(N, v3.add(v3.mul(d, 2.1), [0, 0, 0.8])))));
  };

  // the labourer carrying cement bags from the pallet to the mixer
  const carrier = makePerson(262, 4, rad(40), { speed: 16 });
  carrier.bag = false;
  carrier.sack = solid(carrier.front);
  carrier.route = [
    { to: [262, 4] }, { face: toward({ x: 262, y: 4 }, PALLET) }, { wait: 0.8, then: () => { carrier.bag = true; } },
    { to: [256, 34] }, { face: toward({ x: 256, y: 34 }, MIXER) }, { wait: 0.9, then: () => { carrier.bag = false; } },
  ];
  carrier.ri = 0;
  carrier.arms = (s, Wd) => (carrier.bag && s < 0 ? [Wd(0.6, -4.2, 18.6), Wd(1.3, -3, 19.9)] : null);
  carrier.extra = (p, Wd, near) => {
    if (!p.bag) { setD(p.sack.sil, ""); setD(p.sack.cr, ""); return; }
    const parent = near < 0 ? p.front : p.back;
    if (p.sack.g.parentNode !== parent) parent.appendChild(p.sack.g);
    const c = Wd(0, -3, 0);
    putC(p.sack, rbox(c[0], c[1], p.f, -4, -1.7, 4, 1.7, 15.8, 19.4, 1.6, 0.6));
  };

  const people = [boss, ...signals, watcher, pusher, shovel, carrier];

  function updatePeople(dt) {
    // the barrow and its pusher
    runRoute(pusher, dt);
    hitch();
    barrow.pitch += ((pusher.moving ? rad(9) : 0) - barrow.pitch) * Math.min(1, dt * 6);
    if (barrow.dumped) { barrow.fill = Math.max(0, barrow.fill - dt * 1.4); if (!barrow.fill) barrow.dumped = 0; }

    // the shoveler loads while the barrow waits beside him
    const loading = pusher.ri === 2 && barrow.fill < 1;
    const fPile = toward(shovel, PILE), fBar = toward(shovel, [barrow.x, barrow.y]);
    if (loading || shovel.cyc > 0) {
      const before = shovel.cyc;
      shovel.cyc += dt / 2.2;
      if (before < 0.68 && shovel.cyc >= 0.68) barrow.fill = Math.min(1, barrow.fill + 0.25);
      if (shovel.cyc >= 1) shovel.cyc = loading ? shovel.cyc - 1 : 0;
      const c = shovel.cyc, A = SHOVEL.dig, B = SHOVEL.lift, T = SHOVEL.toss;
      const mixP = (p, q, t) => [v3.lerp(p[0], q[0], t), v3.lerp(p[1], q[1], t)];
      if (c < 0.22) { shovel.f = lerpA(shovel.f, fPile, Math.min(1, dt * 10)); shovel.pose = mixP(SHOVEL.rest, A, smooth(Math.min(1, c / 0.1))); }
      else if (c < 0.38) { shovel.f = fPile; shovel.pose = mixP(A, B, smooth((c - 0.22) / 0.16)); }
      else if (c < 0.6) { shovel.f = lerpA(fPile, fBar, smooth((c - 0.38) / 0.22)); shovel.pose = B; }
      else if (c < 0.72) { shovel.f = fBar; shovel.pose = mixP(B, T, smooth((c - 0.6) / 0.12)); }
      else { shovel.f = lerpA(fBar, fPile, smooth((c - 0.72) / 0.28)); shovel.pose = mixP(T, A, smooth((c - 0.72) / 0.28)); }
    } else {
      turnTo(shovel, rad(-60), dt, 1.5);
      shovel.pose = [v3.lerp(shovel.pose[0], SHOVEL.rest[0], Math.min(1, dt * 4)), v3.lerp(shovel.pose[1], SHOVEL.rest[1], Math.min(1, dt * 4))];
    }

    runRoute(carrier, dt);

    // signalmen follow their crane's job
    for (const p of signals) {
      const k = p.k, b = k.job;
      p.t += dt;
      let to = p.k.home, look = [k.x + k.r * Math.cos(k.th), k.y + k.r * Math.sin(k.th)];
      if (k.mode === "setdown") { to = [k.spot[0] + 3, k.spot[1] + 17]; look = k.spot; }
      else if (b && b.state === "ground") { to = [b.x + 3, b.y + 17]; look = [b.x, b.y]; }
      else if (b) { to = [b.slot.cx + 3, 30]; look = [b.slot.cx, b.slot.cy]; }
      const there = walkTo(p, to[0], to[1], dt);
      if (there) turnTo(p, toward(p, look), dt, 4);
      const want = there && k.cur && k.cur.low && b ? 1 : 0;
      p.raise += (want - p.raise) * Math.min(1, dt * 5);
      p.cheer += ((story.phase === "fixed" ? 1 : 0) - p.cheer) * Math.min(1, dt * 5);
    }

    // the manager turns to whatever is being set down and points at it
    const busy = cranes.find((k) => k.cur && k.cur.low && k.job);
    if (busy) boss.target = [busy.x + busy.r * Math.cos(busy.th) + busy.sx, busy.y + busy.r * Math.sin(busy.th) + busy.sy, busy.h];
    boss.pw += ((busy || story.phase === "fixed" ? 1 : 0) - boss.pw) * Math.min(1, dt * 3);
    if (story.phase === "fixed") boss.target = [boss.x, boss.y - 2, 60];
    const look = busy ? toward(boss, boss.target) : boss.home;
    turnTo(boss, boss.home + clamp(wrap(look - boss.home), -1, 1), dt, 1.2);

    // the onlooker follows the right crane's hook
    const rk = cranes[1];
    turnTo(watcher, toward(watcher, [rk.x + rk.r * Math.cos(rk.th), rk.y + rk.r * Math.sin(rk.th)]), dt, 0.8);

    for (const p of people) p.amp += ((p.moving ? 1 : 0) - p.amp) * Math.min(1, dt * 7);
  }

  return {
    people, barrow, update: updatePeople,
    draw() { for (const p of people) drawPerson(p); drawBarrow(barrow); },
  };
}

/**
 * Construction 404. A 404 built of blocks, broken: the missing blocks lie on
 * the ground in front of it, and two tower cranes lift them back into their
 * places while a crew works the site below. A manager points the work out,
 * a signalman walks with each crane, a shoveler loads a wheelbarrow from the
 * sand pile, the barrow runs to the mixer, and a labourer carries cement bags
 * to it. When the last block is set the sign lights up, shakes, and breaks
 * again, and the work starts over.
 *
 * Any block in place can be knocked out: click or tap it, or pick it with the
 * arrow keys and press Enter. It falls with every block stacked on it, and
 * its crane puts them back, always from the bottom of a column up.
 *
 * Drawn on the Hairline kernel (HL). The scene is split by part: core (camera,
 * layout, layers, helpers), ground, blocks, cranes and people; this file holds
 * the story, the frame loop and the reader's input.
 *
 * construction404(stage, svg, opts) → { destroy, aspect, knock, where, advance, snapshot, time }
 *   stage       the element carrying data-hairline; it gets the pointer and the keys
 *   svg         an <svg> inside it; the scene sets its viewBox
 *   opts.frame  "full" (the whole site, about 16:9) or "core" (the 404 and both cranes, for a tall screen)
 *   opts.t      seconds to run the site forward before the first frame
 *   opts.freeze draw that one frame and stop
 *   opts.onRead     a short status: "fixing 3/8", "fixed", "breaking"
 *   opts.onAnnounce a sentence for a live region, after something the reader did
 *   opts.onKnock    the number of blocks the reader has knocked out
 *   opts.onSound    { kind: "impact" | "set", strength 0..1, pan -1..1 } when a block hits the ground or is set down
 *   aspect      the viewBox's width over its height, for sizing the stage
 */
function construction404(stage, svg, opts = {}) {
  const { register, disposer, reducedMotion, rad, clamp, TAU } = { ...HL, TAU: Math.PI * 2 };
  const bag = disposer();
  const noop = () => {};
  const onRead = opts.onRead || noop, onAnnounce = opts.onAnnounce || noop, onKnock = opts.onKnock || noop, onSound = opts.onSound || noop;

  const ctx = siteCore(svg, opts);
  const { VW, VH, SZ, S, slots, slotAt, broken, items, layer, story, still } = ctx;
  const B = siteBlocks(ctx), G = siteGround(ctx), CR = siteCranes(ctx, B);
  ctx.cranes = CR.cranes;
  const PE = sitePeople(ctx, B, CR);
  const { blocks, isIn, isOut, clear, taken, findSpot } = B;
  const cranes = CR.cranes;

  // ---------------------------------------------------------------- the story
  const craneFor = (s) => cranes.find((k) => k.take(s.col));

  /** Knocks the block in slot s out, with every block standing on it in its column. Returns how many fell. */
  function knockOut(s, o = {}) {
    if (s.block.state !== "slot") return 0;
    const stack = slots.filter((q) => q.col === s.col && q.lvl >= s.lvl && q.block.state === "slot").sort((a, b) => a.lvl - b.lvl);
    stack.forEach((q, i) => {
      const b = q.block, spot = !o.byReader && q.spot && clear(q.spot[0], q.spot[1], taken()) ? q.spot : findSpot(q, craneFor(q));
      story.seq++;
      if (still()) { Object.assign(b, { state: "ground", x: spot[0], y: spot[1], z: 0, yaw: rad(spot[2]) }); return; }
      b.state = "falling";
      b.fall = { t: -((o.delay || 0) + i * 0.12), x0: q.cx, y0: q.cy, z0: q.z0, x1: spot[0], y1: spot[1], yaw: rad(spot[2]) + (story.seq % 2 ? TAU : -TAU) * 0.5, dur: 0.75 + q.z0 / 160 };
    });
    story.lost += stack.length;
    if (story.phase !== "repair") { story.phase = "repair"; story.pt = 0; }
    if (o.byReader) {
      story.knocked += stack.length; story.byReader = true;
      onKnock(story.knocked);
      onAnnounce(stack.length === 1 ? "You knocked out a block. A crane will put it back." : `You knocked out ${stack.length} blocks. A crane will put them back.`);
    }
    return stack.length;
  }

  /** Without motion there is no crane to watch, so a block that is out goes straight back. */
  function putBack(s) {
    Object.assign(s.block, { state: "slot", x: s.cx, y: s.cy, z: s.z0, yaw: 0 });
    story.placed++;
    onAnnounce("The block is back in place.");
  }

  function director(dt) {
    story.pt += dt;
    if (story.phase === "repair" && story.lost > 0 && blocks.every((b) => b.state === "slot")) {
      Object.assign(story, { phase: "fixed", pt: 0, lost: 0, placed: 0 });
      if (story.byReader) { story.byReader = false; onAnnounce("Every block is back in place."); }
    } else if (story.phase === "fixed" && story.pt > 3.6) { story.phase = "shake"; story.pt = 0; }
    else if (story.phase === "shake" && story.pt > 0.8) {
      story.phase = "repair"; story.pt = 0;
      broken.slice().sort((a, b) => b.lvl - a.lvl || a.col - b.col).forEach((q, i) => knockOut(q, { delay: i * 0.11 }));
    }
  }

  // ---- what the site sounds like: a block meeting the ground, read from the blocks' own motion
  let audible = false;
  const pan = (b) => clamp((ctx.P(b.x, b.y, 0)[0] / VW) * 2 - 1, -1, 1) * 0.8;
  function listen(before, dt) {
    if (!audible) return;
    for (const b of blocks) {
      const was = before.get(b);
      if (b.state === "falling") {
        // a falling block's first touch of the ground, and any bounce after it, by how fast it came down
        const pz = b.__pz ?? b.z, vz = (pz - b.z) / dt;
        if (b.z <= 0.6 && pz > 0.6 && vz > 2) onSound({ kind: "impact", strength: clamp(vz / 70, 0.15, 1), pan: pan(b) });
        b.__pz = b.z;
      } else b.__pz = undefined;
      if (was === "carried" && b.state !== "carried") onSound({ kind: "set", strength: 0.3, pan: pan(b) });
    }
  }

  function sim(dt) {
    const before = audible ? new Map(blocks.map((b) => [b, b.state])) : null;
    story.clock += dt;
    director(dt);
    CR.update(dt);
    B.update(dt);
    PE.update(dt);
    G.update(dt);
    listen(before, dt);
  }

  let read = "";
  function draw() {
    B.draw(active());
    CR.draw();
    PE.draw();
    G.draw();
    // repaint in depth order, only when the order changed
    let sorted = true;
    for (let i = 1; i < items.length; i++) if (items[i].key < items[i - 1].key) { sorted = false; break; }
    if (!sorted) { items.sort((a, b) => a.key - b.key); for (const it of items) layer.appendChild(it.g); }
    const text = story.phase === "fixed" ? "fixed" : story.phase === "shake" ? "breaking" : `fixing ${story.placed}/${story.lost}`;
    if (text !== read) { read = text; onRead(text); }
  }

  // ---------------------------------------------------------------- life
  const advance = (sec) => { let left = sec; while (left > 1e-6) { const h = Math.min(left, 1 / 90); sim(h); left -= h; } };
  advance(Math.max(0, opts.t || 0));
  if (reducedMotion() && !opts.t) advance(8.6); // a still with both cranes at work
  // the block under the pointer, and the one picked with the keys
  let hover = null, sel = null;
  const active = () => hover || sel;
  // register draws the first frame at once; the kernel clamps dt to 50ms
  const loop = register(stage, (dt) => {
    if (still()) { draw(); return false; }
    audible = true;       // only the live clock makes sound, never a skip ahead
    advance(dt);
    audible = false;
    draw();
    return true;
  });
  bag.add(loop.unregister);
  const poke = () => { if (still()) draw(); else loop.wake(); };

  // ---- the reader's hand: hover marks a block, a press knocks it out
  const inside = (poly, [x, y]) => {
    let sign = 0;
    for (let i = 0; i < poly.length; i++) {
      const [ax, ay] = poly[i], [bx, by] = poly[(i + 1) % poly.length], c = (bx - ax) * (y - ay) - (by - ay) * (x - ax);
      if (c) { if (!sign) sign = Math.sign(c); else if (Math.sign(c) !== sign) return false; }
    }
    return true;
  };
  /** The nearest slot whose rest pose holds the point; a finger also gets the nearest within half a block. */
  function slotAtPoint(p, want, finger) {
    let best = null;
    for (const s of slots) if (want(s) && inside(s.hit, p) && (!best || s.key > best.key)) best = s;
    if (best || !finger) return best;
    let d0 = 0.75 * SZ * S;
    for (const s of slots) { const d = want(s) && Math.hypot(p[0] - s.mid[0], p[1] - s.mid[1]); if (d !== false && d < d0) { best = s; d0 = d; } }
    return best;
  }
  const toView = (e) => {
    const m = svg.getScreenCTM();
    if (!m) return [-1, -1];
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    return [q.x, q.y];
  };
  const setHover = (s) => { if (s !== hover) { hover = s; stage.style.cursor = s ? "pointer" : ""; poke(); } };

  bag.on(stage, "pointermove", (e) => { if (e.pointerType === "mouse") setHover(slotAtPoint(toView(e), isIn, false)); });
  bag.on(stage, "pointerleave", () => setHover(null));
  bag.on(stage, "pointerdown", (e) => {
    if (e.button !== 0) return;
    const p = toView(e), finger = e.pointerType !== "mouse";
    const s = slotAtPoint(p, isIn, finger);
    if (s) { knockOut(s, { byReader: true }); hover = null; stage.style.cursor = ""; poke(); return; }
    if (still()) { const g = slotAtPoint(p, isOut, finger); if (g) { putBack(g); poke(); } }
  });

  // ---- the keys: arrows walk the blocks, Enter or Space knocks one out
  const DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] };
  function walk(from, [dc, dl]) {
    if (!from) return slots.filter(isIn).sort((a, b) => Math.hypot(a.col - 5, a.lvl - 2) - Math.hypot(b.col - 5, b.lvl - 2))[0] || slots[0];
    let best = null, score = 0;
    for (const s of slots) {
      const along = dc ? (s.col - from.col) * dc : (s.lvl - from.lvl) * dl, across = dc ? Math.abs(s.lvl - from.lvl) : Math.abs(s.col - from.col);
      if (along <= 0) continue;
      const sc = along + across * 3;
      if (!best || sc < score) { best = s; score = sc; }
    }
    return best || from;
  }
  const say = (s) => onAnnounce(isIn(s) ? "Block in place. Press Enter to knock it out." : "Block out. A crane will put it back.");
  bag.on(stage, "keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (DIRS[e.key]) { e.preventDefault(); sel = walk(sel, DIRS[e.key]); say(sel); poke(); return; }
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (!sel) { sel = walk(null); say(sel); }
      else if (isIn(sel)) knockOut(sel, { byReader: true });
      else if (still() && isOut(sel)) putBack(sel);
      else say(sel);
      poke();
      return;
    }
    if (e.key === "Escape" && sel) { sel = null; poke(); }
  });
  bag.on(stage, "blur", () => { if (sel) { sel = null; poke(); } });
  bag.add(() => { svg.replaceChildren(); stage.style.cursor = ""; });

  return {
    destroy: bag.dispose,
    aspect: VW / VH,
    time: () => story.clock,
    /** Knocks out the block at a column and level, as a press would. Returns how many fell. */
    knock: (col, lvl) => { const s = slotAt(col, lvl), n = s ? knockOut(s, { byReader: true }) : 0; poke(); return n; },
    /** Where a block's rest pose sits, in viewBox units. */
    where: (col, lvl) => { const s = slotAt(col, lvl); return s ? s.mid.slice() : null; },
    /** Runs the site forward, for tests and for skipping ahead. */
    advance: (sec) => { advance(sec); draw(); },
    snapshot: () => ({
      phase: story.phase, lost: story.lost, placed: story.placed, knocked: story.knocked,
      blocks: blocks.map((b) => ({ col: b.slot.col, lvl: b.slot.lvl, state: b.state, x: b.x, y: b.y })),
      cranes: cranes.map((k) => ({ job: k.job && `${k.job.slot.col},${k.job.slot.lvl}`, mode: k.mode, h: k.h })),
    }),
  };
}
</script>
<script id="site-sound">
/**
 * The site's sound: a construction ambience on a loop at 60%, and a brick
 * hitting concrete each time a block lands, softer when a crane sets one down.
 * It stays off until the reader turns it on (browsers start audio only after a
 * press), and remembers their choice for the next visit.
 *
 * siteSound({ ambience, impact }) → { on, setOn(on), play(event) }
 *   event   what the scene reports: { kind: "impact" | "set", strength 0..1, pan -1..1 }
 *
 * Web Audio plays both files where it can fetch them. Opened from disk, where a
 * fetch is refused, plain audio elements stand in.
 */
function siteSound(files) {
  /** The impact recording holds six separate hits: [offset, length] in seconds. Each landing takes the next. */
  const HITS = [[0, 0.9], [2.19, 0.62], [4.0, 0.72], [5.96, 0.62], [7.93, 0.44], [9.61, 0.74]];
  const AMBIENCE = 0.6, KEY = "construction404:sound";
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac = null, master = null, bed = null, loop = null, bufs = null, loading = null, fb = null;
  let on = false, turn = 0, voices = 0, last = -1;

  const ramp = (param, to, sec) => {
    const t = ac.currentTime;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(to, t + sec);
  };

  function graph() {
    if (ac || !AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    bed = ac.createGain(); bed.gain.value = 0; bed.connect(master);
  }
  const decode = (url) => fetch(url)
    .then((r) => { if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.arrayBuffer(); })
    .then((data) => new Promise((ok, fail) => ac.decodeAudioData(data, ok, fail)));
  function load() {
    if (!loading) {
      loading = Promise.all([decode(files.ambience), decode(files.impact)])
        .then(([a, i]) => { bufs = { a, i }; })
        .catch(() => { fallback(); });
    }
    return loading;
  }
  function fallback() {
    if (fb) return;
    const bedEl = new Audio(files.ambience);
    bedEl.loop = true; bedEl.volume = AMBIENCE;
    fb = { bed: bedEl, pool: Array.from({ length: 4 }, () => new Audio(files.impact)), next: 0 };
  }
  function startBed() {
    if (bufs && !loop) {
      loop = ac.createBufferSource();
      loop.buffer = bufs.a; loop.loop = true; loop.connect(bed);
      loop.start();
      ramp(bed.gain, AMBIENCE, 1.5);
    } else if (fb) fb.bed.play().catch(() => {});
  }

  const store = (v) => { try { localStorage.setItem(KEY, v ? "on" : "off"); } catch { /* private window: forget it */ } };
  const stored = () => { try { return localStorage.getItem(KEY) === "on"; } catch { return false; } };

  function setOn(v) {
    on = !!v;
    store(on);
    if (on) {
      graph();
      if (ac) {
        ac.resume();
        ramp(master.gain, 1, 0.4);
        load().then(() => { if (on) startBed(); });
      } else { fallback(); startBed(); }
    } else {
      if (ac) { ramp(master.gain, 0, 0.25); setTimeout(() => { if (!on) ac.suspend(); }, 320); }
      if (fb) fb.bed.pause();
    }
  }

  function play(e) {
    if (!on) return;
    const strength = Math.max(0, Math.min(1, e.strength ?? 0.5)), set = e.kind === "set";
    const [offset, length] = HITS[turn++ % HITS.length];
    const vol = set ? 0.4 : 0.35 + 0.65 * strength;
    if (bufs && ac && ac.state === "running") {
      const t = ac.currentTime;
      // a pile of blocks landing together is one crash, not a machine gun
      if (voices >= 6 || (t - last < 0.05 && strength < 0.7)) return;
      last = t;
      const src = ac.createBufferSource(), gain = ac.createGain();
      src.buffer = bufs.i;
      const rate = (set ? 0.82 : 0.93) + ((turn * 0.137) % 0.14);
      src.playbackRate.value = rate;
      const end = t + length / rate;
      gain.gain.setValueAtTime(vol, t);
      gain.gain.setValueAtTime(vol, end - 0.08);
      gain.gain.linearRampToValueAtTime(0, end);
      src.connect(gain);
      if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = e.pan || 0; gain.connect(p); p.connect(master); }
      else gain.connect(master);
      voices++;
      src.onended = () => { voices--; };
      src.start(t, offset, length);
    } else if (fb) {
      const el = fb.pool[fb.next++ % fb.pool.length];
      try { el.currentTime = offset; } catch { /* not loaded yet */ }
      el.volume = Math.min(1, vol);
      el.play().catch(() => {});
      clearTimeout(el.stopAt);
      el.stopAt = setTimeout(() => el.pause(), length * 1000);
    }
  }

  // Hidden tabs go quiet; coming back resumes only if the reader left it on.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (ac) ac.suspend(); if (fb) fb.bed.pause(); }
    else if (on) { if (ac) ac.resume(); if (fb) fb.bed.play().catch(() => {}); }
  });

  return { get on() { return on; }, wanted: stored(), setOn, play };
}
</script>
<script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    if (["light", "dark"].includes(params.get("theme"))) document.documentElement.dataset.theme = params.get("theme");

    HL.inject(document);
    const stage = $("stage"), live = $("live"), toggle = $("sound");

    // Sound starts off. A reader who left it on last time hears it from their first press anywhere.
    const sound = siteSound({ ambience: "audio/ambience.mp3", impact: "audio/impact.mp3" });
    const show = (on) => toggle.setAttribute("aria-pressed", String(on));
    toggle.addEventListener("click", () => { sound.setOn(!sound.on); show(sound.on); });
    if (sound.wanted) {
      show(true);
      const wake = (e) => {
        removeEventListener("pointerdown", wake, true); removeEventListener("keydown", wake, true);
        if (e.target.closest && e.target.closest("#sound")) return; // the toggle handles its own press
        if (!sound.on && toggle.getAttribute("aria-pressed") === "true") sound.setOn(true);
      };
      addEventListener("pointerdown", wake, true); addEventListener("keydown", wake, true);
    }
    const svg = HL.mk("svg", { "aria-hidden": "true" }, stage);

    // A tall screen gets the 404 and its cranes up close; a wide one gets the whole site.
    const frameFor = () => params.get("frame") || (innerWidth < innerHeight ? "core" : "full");
    let site = null, frame = "";
    function mount() {
      if (site) site.destroy();
      frame = frameFor();
      site = construction404(stage, svg, {
        frame,
        t: Number(params.get("t")) || 0,
        freeze: params.has("freeze"),
        onAnnounce: (text) => { live.textContent = text; },
        onSound: (e) => sound.play(e),
      });
      stage.dataset.frame = frame;
      stage.style.setProperty("--aspect", site.aspect.toFixed(4));
      if (params.has("test")) window.site = site;
    }
    mount();
    let wait = 0;
    addEventListener("resize", () => {
      clearTimeout(wait);
      wait = setTimeout(() => { if (frameFor() !== frame) mount(); }, 150);
    });
  })();
</script>
</body>
